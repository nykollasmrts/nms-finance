<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NMS Diagnóstico">
<title>NMS Diagnóstico</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0A0A; --ink2:#3A424D; --muted:#5B6470; --line:#E1E5EA; --soft:#F3F5F7; --soft2:#EEF1F4;
  --blue:#1F6FA8; --blue-l:#7CC8F2; --white:#fff;
  --ok:#1E8E5A; --ok-bg:#E7F5EE; --warn:#B7791F; --warn-bg:#FDF4E3; --bad:#C0392B; --bad-bg:#FBEAE8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--soft);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
header{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.bar{margin:0 auto;padding:12px max(20px,env(safe-area-inset-right)) 12px max(20px,env(safe-area-inset-left));display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:8px;cursor:pointer;user-select:none}
.logo b{font-weight:600;font-size:24px;letter-spacing:-.04em;position:relative;padding-right:9px}
.logo b::after{content:"";position:absolute;right:0;top:4px;width:7px;height:7px;border-radius:50%;background:var(--blue-l)}
.logo span{font-size:13px;color:var(--muted);letter-spacing:.04em}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:500}
nav button.on{background:var(--ink);color:#fff}
main{margin:0 auto;padding:24px clamp(16px,2.5vw,40px) calc(60px + env(safe-area-inset-bottom))}
html,body{min-height:100%}
h1{font-family:Montserrat,Inter,sans-serif;font-weight:600;font-size:26px;letter-spacing:-.02em;margin:0}
h2{font-size:17px;margin:0 0 12px;font-weight:600}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--blue);margin:20px 0 10px;font-weight:700}
h3:first-child{margin-top:0}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn.ghost{background:var(--white);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:var(--white);color:var(--bad);border-color:#efc7c2}
.btn.sm{padding:6px 11px;font-size:13px}
.grid{display:grid;gap:12px 16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink2);font-weight:500}
label.f small{color:var(--muted);font-weight:400}
input[type=text],input[type=number],input[type=email],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);background:var(--white);border-radius:9px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,111,168,.12)}
textarea{min-height:80px;resize:vertical}
.money{position:relative}
.money::before{content:"R$";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.money input{padding-left:34px}
.pct{position:relative}
.pct::after{content:"%";position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.split{display:grid;grid-template-columns:minmax(0,1fr) clamp(380px,30vw,520px);gap:20px;align-items:start}
.sticky{position:sticky;top:84px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 20px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.tabs button i{font-style:normal;display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--soft2);font-size:11px;line-height:20px;text-align:center;margin-right:6px}
.tabs button.on i{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--soft2);color:var(--ink2);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.badge.ok{background:var(--ok-bg)} .badge.warn{background:var(--warn-bg)} .badge.bad{background:var(--bad-bg)}
.badge.plain::before{display:none}
.verdict{border-radius:12px;padding:14px 16px;margin:12px 0;border:1px solid}
.verdict.ok{background:var(--ok-bg);border-color:#bfe3cf}
.verdict.warn{background:var(--warn-bg);border-color:#f1d9a8}
.verdict.bad{background:var(--bad-bg);border-color:#efc7c2}
.verdict strong{display:block;font-size:16px;margin-bottom:3px}
.verdict p{margin:0;color:var(--ink2);font-size:14px}
.score{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.ring{--v:0;--c:var(--muted);width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--soft2) 0);display:grid;place-items:center;flex:none}
.ring div{width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:700;font-size:22px}
.meter{height:6px;background:var(--soft2);border-radius:9px;overflow:hidden;margin-top:4px}
.meter span{display:block;height:100%;border-radius:9px}
.ind{padding:9px 0;border-bottom:1px solid var(--line)}
.ind:last-child{border-bottom:0}
.ind .row{gap:8px}
.ind .v{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.ind p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.svc{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:#fff}
.svc.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.svc input{margin-top:3px;width:18px;height:18px;accent-color:var(--ink)}
.svc .t{font-weight:600}
.svc .d{font-size:13px;color:var(--muted)}
.svc .p{margin-left:auto;text-align:right;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.list{display:grid;gap:10px}
.client{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) 140px 130px 130px;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.client:hover{border-color:var(--ink)}
.client .nm{font-weight:600}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.yn{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.yn select{width:auto;padding:6px 8px}
.alerts{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink2)}
.alerts li{margin:3px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.cfgtable input{padding:6px 8px;min-width:70px}
.cfgtable td{padding:6px 4px}
.hint{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink2)}
.print-only{display:none}
.doc h1{font-size:28px}
.doc .sec{margin-top:22px}
.prop{max-width:900px;margin:0 auto}
.blk{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.blk label.f{gap:4px;justify-content:flex-end}
.blk .money input[type=text]{padding-left:34px}
.blk input[type=text],.blk input[type=number]{padding:8px 10px}
.blk .yns{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));column-gap:24px}
.blk .yn{padding:6px 0}
.blk h4{margin:0 0 10px;font-size:15px}
.blk .grid{grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px 12px}
details.more{border:1px dashed var(--line);border-radius:12px;padding:10px 16px;margin-bottom:14px}
details.more>summary{cursor:pointer;font-weight:600;color:var(--blue);list-style:none}
details.more>summary::before{content:"+ ";}
details.more[open]>summary::before{content:"− ";}
details.more[open]>summary{margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:#fff;padding:6px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.s{background:var(--ink);color:#fff}
.seg button.on.n{background:var(--ink);color:#fff}
.big3{display:grid;grid-template-columns:1fr;gap:8px;margin:12px 0}
.bn{background:var(--soft);border-radius:12px;padding:12px 14px}
.bn .l{font-size:13px;color:var(--muted)}
.bn .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bn .s{font-size:12px;color:var(--muted)}
.status{border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.status.ok{background:var(--ok-bg)} .status.warn{background:var(--warn-bg)} .status.bad{background:var(--bad-bg)} .status.plain{background:var(--soft)}
.status .sc{font-size:34px;font-weight:700;line-height:1}
.status .tx b{display:block;font-size:17px}
.status .tx span{font-size:13px;color:var(--ink2)}
.price2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.price2 .bn.dark{background:var(--ink);color:#fff} .price2 .bn.dark .l,.price2 .bn.dark .s{color:#cfd5dc}
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.svcs .svc{padding:12px;align-items:center}
.prop .sec{break-inside:avoid}
.prop p{margin:0 0 8px;color:var(--ink2)}
.prop .hero{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.prop .box{border:1px solid var(--line);border-radius:12px;padding:16px}
.prop .box.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.prop .box .lb{font-size:12px;text-transform:uppercase;letter-spacing:.1em;opacity:.75}
.prop .box .vl{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:4px 0;font-variant-numeric:tabular-nums}
.prop .box .dt{font-size:13px;opacity:.8}
.prop ol{margin:0;padding-left:20px;color:var(--ink2)} .prop ol li{margin:4px 0}
.prop .opp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.prop .opp div{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px}
.prop .opp b{display:block;margin-bottom:2px}
.prop .sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:34px}
.prop .chips{display:flex;flex-wrap:wrap;gap:8px}
.prop .chips span{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.prop .ganhos{margin:12px 0 0;padding-left:18px;color:var(--ink2);font-size:14px} .prop .ganhos li{margin:4px 0}
.prop .cond{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prop .cond div{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.prop .cond span{display:block;font-size:12px;color:var(--muted)}
.prop .sign div{border-top:1px solid var(--ink);padding-top:6px;font-size:13px;color:var(--muted)}
.prop .clausulas{margin-top:34px;padding-top:24px;border-top:2px dashed var(--line)}
.prop ol.cl{margin:0;padding-left:20px;font-size:12px;line-height:1.4;color:var(--ink2)}
.prop ol.cl li{margin:0 0 4px;text-align:justify}
.prop .sign.wit{margin-top:22px}
@media print{ .prop .clausulas{break-before:page;page-break-before:always;margin-top:0;padding-top:0;border-top:0} .prop .sec{margin-top:16px} .prop .foot{margin-top:18px;font-size:11.5px;gap:4px 14px} .prop ol.cl{font-size:11.6px;line-height:1.38} .prop .sign{margin-top:24px} .prop .box{padding:13px} .prop .box .vl{font-size:27px} }
.prop .foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
@media (max-width:640px){ .prop .hero,.prop .sign{grid-template-columns:1fr} .prop .cond{grid-template-columns:1fr 1fr} .prop .box .vl{font-size:26px} }
@media print{ @page{size:A4;margin:14mm} .prop{max-width:none} .prop .box.dark{-webkit-print-color-adjust:exact;print-color-adjust:exact} }
@media (min-width:1600px){ .grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))} }
.cfgtable{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fsbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--ink2);font-weight:500}
.fsbtn:hover{border-color:var(--ink)}
.mbar{display:none}
.tabs .sm,nav .sm{display:none}
@media (max-width:980px){
  .split{grid-template-columns:1fr}
  .sticky{position:static}
  .client{grid-template-columns:1fr auto;gap:6px}
  .client .hide-m{display:none}
}
@media (max-width:640px){
  html,body{font-size:15px}
  input[type=text],input[type=number],input[type=email],input[type=date],input[type=search],input[type=tel],select,textarea{font-size:16px} /* evita zoom no iPhone */
  .bar{gap:8px;padding-top:10px;padding-bottom:10px;flex-wrap:nowrap}
  nav .lg{display:none} nav .sm{display:inline}
  .logo span{display:none}
  nav{gap:2px}
  nav button{padding:7px 9px;font-size:14px}
  .fsbtn{padding:6px 8px}
  .fsbtn span{display:none}
  main{padding-top:16px}
  h1{font-size:21px}
  .card{padding:16px;border-radius:12px}
  .grid{grid-template-columns:1fr}
  .tabs{margin:12px -16px 16px;padding:0 16px;position:sticky;top:57px;background:var(--soft);z-index:5}
  .tabs button{padding:10px 10px}
  .tabs .lg{display:none}
  .tabs .sm{display:inline}
  .cli-head{flex-direction:column;align-items:stretch!important}
  .cli-head .row{width:100%}
  .cli-head select{flex:1}
  .svc{padding:12px}
  .svcs{grid-template-columns:1fr 1fr}
  .blk .grid{grid-template-columns:1fr 1fr;gap:10px}
  .blk .grid label.f{font-size:12.5px}
  .blk{padding:12px}
  .svcs .svc{padding:10px;font-size:14px}
  .kv{font-size:14px}
  .doc .split{grid-template-columns:1fr!important}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));align-items:center;gap:10px;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  .mbar .mv{font-weight:700;font-size:16px}
  .mbar .btn{margin-left:auto}
  main.has-mbar{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
}
@media print{
  html,body{background:#fff}
  header,.tabs,.no-print,.toast,.mbar{display:none!important}
  main{padding:0;max-width:none}
  .card{border:0;padding:0}
  .print-only{display:block}
  .split{grid-template-columns:1fr}
}
.voltar{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--ink2);font-weight:500;text-decoration:none}
.voltar:hover{border-color:var(--ink)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sync.err{color:var(--bad);font-weight:600}
#gate{position:fixed;inset:0;z-index:50;background:var(--soft);display:flex;align-items:center;justify-content:center;padding:24px}
#gate .card{max-width:420px;text-align:center}
#gate[hidden]{display:none}
@media (max-width:760px){.voltar span,.sync{display:none}}
@media print{.voltar,.sync,#gate{display:none!important}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="voltar" href="./" title="Voltar para o app NMS">‹ <span>App NMS</span></a>
    <div class="logo" onclick="go('clientes')"><b>nms</b><span>diagnóstico e precificação</span></div>
    <span class="sync" id="sync">Conectando…</span>
    <nav id="nav">
      <button data-v="clientes" onclick="go('clientes')">Clientes</button>
      <button data-v="config" onclick="go('config')"><span class="lg">Configurações</span><span class="sm">Ajustes</span></button>
      <button data-v="backup" onclick="go('backup')">Backup</button>
      <button class="fsbtn" id="fsbtn" onclick="telaCheia()" title="Tela cheia">⛶ <span>Tela cheia</span></button>
    </nav>
  </div>
</header>
<main id="app"></main>
<div id="gate"><div class="card"><h2 id="gate-t">Carregando…</h2><p class="muted small" id="gate-p">Conferindo seu acesso.</p><a class="btn" id="gate-b" href="./" hidden>Voltar para o app</a></div></div>
<div class="mbar" id="mbar"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* ============================================================
   NMS Diagnóstico e Precificação — ferramenta interna
   Dentro do app NMS: os dados ficam no Supabase (tabela nms_diagnostico)
   e só quem está autorizado no banco (Nykollas e Kayan) lê ou grava.
   ============================================================ */

const DEFAULT_CONFIG = {
  servicos: [
    {id:'pagar',     nome:'Contas a pagar',        desc:'Controle de vencimentos e lançamento dos pagamentos.',          preco:0, volume:'pagar',   incluso:80, extra:0,   horas:6, ativo:true},
    {id:'receber',   nome:'Contas a receber',      desc:'Lançamento dos recebimentos e acompanhamento de quem está em atraso.', preco:0, volume:'receber', incluso:80, extra:0,   horas:6, ativo:true},
    {id:'concil',    nome:'Conciliação bancária',  desc:'Conferência do extrato, diferenças corrigidas, saldo confiável.', preco:0, volume:'contas',  incluso:1,  extra:0, horas:4, ativo:true},
    {id:'fluxo',     nome:'Fluxo de caixa',        desc:'Previsão de entradas e saídas e alerta antes do aperto.',        preco:0, volume:'',        incluso:0,  extra:0,   horas:3, ativo:true},
    {id:'relatorios',nome:'Relatórios mensais',    desc:'DRE gerencial explicado, indicadores do mês e reunião de resultado.', preco:0, volume:'',   incluso:0,  extra:0,   horas:4, ativo:true}
  ],
  pacote: {d2:5, d3:10, d4:15},          // % de desconto por quantidade de serviços
  complexidade: {baixa:1, media:1.15, alta:1.3},
  complexAuto: {fatMedia:80000, fatAlta:300000, funcMedia:6, funcAlta:16},
  tabela: 3,
  fixoMensal: 680,        // mensalidade fixa da NMS
  variavelPct: 0.5,       // % sobre o valor recebido por mês (faturamento)
  variavelTeto: 0,        // teto da parte variável em R$ (0 = sem teto)
  minimoMensal: 680,
  implantacaoPct: 0, implantacaoMin: 800,
  descontoMax: 15,
  arredondar: 10,
  oferta: {ativa:false, meses:6, descontoPct:50, implantacao:800}, // oferta de entrada padrão nas propostas

function clone(o){return JSON.parse(JSON.stringify(o))}
function mergeDefaults(def, val){
  if(Array.isArray(def)) return Array.isArray(val)?val:clone(def);
  if(def && typeof def==='object'){
    const out = {}; const v = (val&&typeof val==='object')?val:{};
    for(const k in def) out[k] = mergeDefaults(def[k], v[k]);
    for(const k in v) if(!(k in out)) out[k]=v[k];
    return out;
  }
  return (val===undefined||val===null||val==='')?def:val;
}
function load(d){
  d = d||{};
  const config = mergeDefaults(DEFAULT_CONFIG, d.config);
  if((d.config||{}).tabela!==2){ // tabela 2 (22/11/2026): 10% abaixo do preço de mercado
    const antigo={pagar:[400,3],receber:[400,3],concil:[300,120],fluxo:[300,0],relatorios:[450,0]};
    config.servicos.forEach(sv=>{const a=antigo[sv.id], nv=DEFAULT_CONFIG.servicos.find(x=>x.id===sv.id); if(a&&nv){ if(+sv.preco===a[0]) sv.preco=nv.preco; if(+sv.extra===a[1]) sv.extra=nv.extra; }});
    if(+config.minimoMensal===500) config.minimoMensal=DEFAULT_CONFIG.minimoMensal;
    if(+config.implantacaoMin===400) config.implantacaoMin=DEFAULT_CONFIG.implantacaoMin;
    config.tabela=2;
  }
  const clientes = Array.isArray(d.clientes)?d.clientes:[];
  if(config.propostaPadrao.formaPagamento==='Boleto ou Pix') config.propostaPadrao.formaPagamento='Pix ou transferência';
  clientes.forEach(c=>{ if(c.proposta&&c.proposta.formaPagamento==='Boleto ou Pix') c.proposta.formaPagamento='Pix ou transferência'; if(c.renovacao&&c.renovacao.formaPagamento==='Boleto ou Pix') c.renovacao.formaPagamento='Pix ou transferência'; });
  if(config.tabela!==3){ // tabela 3 (22/11/2026): R$ 680 fixos + % dos recebimentos, implantação R$ 800
    const t2={pagar:[560,4],receber:[560,4],concil:[420,170],fluxo:[420,0],relatorios:[630,0]};
    config.servicos.forEach(sv=>{const a=t2[sv.id]; if(a){ if(+sv.preco===a[0]) sv.preco=0; if(+sv.extra===a[1]) sv.extra=0; }});
    if(+config.minimoMensal===720) config.minimoMensal=680;
    if(+config.implantacaoMin===560) config.implantacaoMin=800;
    if(+config.implantacaoPct===50) config.implantacaoPct=0;
    config.oferta.ativa=false;
    clientes.forEach(c=>{ if(c.preco) delete c.preco.oferta; });

  }
  return {versao:1, clientes, config, ultimoBackup:d.ultimoBackup||null};
}

const CFG_ID='__config';
const NV={sb:null, uid:null, last:{}, saveT:null, busy:false, again:false, puxarT:null, pronto:false};
function canon(o){ // JSON com chaves em ordem: o banco reordena as chaves e isso não pode parecer mudança
  if(Array.isArray(o)) return '['+o.map(canon).join(',')+']';
  if(o&&typeof o==='object') return '{'+Object.keys(o).sort().filter(k=>o[k]!==undefined).map(k=>JSON.stringify(k)+':'+canon(o[k])).join(',')+'}';
  return JSON.stringify(o===undefined?null:o);
}
function syncTag(t,err){const el=document.getElementById('sync'); if(el){el.textContent=t; el.classList.toggle('err',!!err);}}
function gate(t,p,btn){

function fotoLocal(){ const m={}; DB.clientes.forEach(c=>{ m[c.id]=canon(c); }); m[CFG_ID]=canon({config:DB.config, ultimoBackup:DB.ultimoBackup||null, iniciado:true}); return m; }
function save(){ if(!NV.pronto) return; clearTimeout(NV.saveT); syncTag('Salvando…'); NV.saveT=setTimeout(enviar,500); }
async function enviar(){
  NV.saveT=null;
  if(NV.busy){ NV.again=true; return; }
  NV.busy=true;
  try{
    const cur=fotoLocal(), up=[], del=[], agora=new Date().toISOString();
    for(const id in cur) if(cur[id]!==NV.last[id]) up.push({id, tipo:id===CFG_ID?'config':'cliente', data:JSON.parse(cur[id]), updated_at:agora, updated_by:NV.uid});
    for(const id in NV.last) if(!(id in cur)) del.push(id);
    if(up.length){ const {error}=await NV.sb.from('nms_diagnostico').upsert(up); if(error) throw error; }
    if(del.length){ const {error}=await NV.sb.from('nms_diagnostico').delete().in('id',del); if(error) throw error; }
    up.forEach(r=>{ NV.last[r.id]=cur[r.id]; }); del.forEach(id=>{ delete NV.last[id]; });
    syncTag('Salvo na nuvem');
  }catch(e){
    syncTag('Não salvou, tentando de novo…',true);
    setTimeout(save,5000);
  }finally{
    NV.busy=false; if(NV.again){ NV.again=false; save(); }
  }
}
async function linhasNuvem(){
  const {data,error}=await NV.sb.from('nms_diagnostico').select('id,tipo,data').limit(5000);
  if(error) throw error; return data||[];
}
const porCriado=(a,b)=>String(b.criado||'').localeCompare(String(a.criado||''));
// traz o que a outra pessoa mudou (tempo real, ao voltar para a janela e a cada 30 s)
function agendarPuxar(ms){ clearTimeout(NV.puxarT); NV.puxarT=setTimeout(puxar, ms==null?400:ms); }
async function puxar(){
  if(!NV.pronto) return;
  const a=document.activeElement;
  if(NV.saveT||NV.busy||(a&&a.closest&&a.closest('#app')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))) return agendarPuxar(3000); // não atrapalha quem está digitando
  let rows; try{ rows=await linhasNuvem(); }catch(e){ return; }
  if(NV.saveT||NV.busy) return agendarPuxar(3000);
  const rem={}; rows.forEach(r=>{ rem[r.id]=canon(r.data); });
  let mudou=false;
  rows.forEach(r=>{
    if(rem[r.id]===NV.last[r.id]) return;
    mudou=true;
    if(r.id===CFG_ID){ DB.config=mergeDefaults(DEFAULT_CONFIG,r.data.config); DB.ultimoBackup=r.data.ultimoBackup||null; }
    else { const i=DB.clientes.findIndex(c=>c.id===r.id); if(i>=0) DB.clientes[i]=r.data; else { DB.clientes.push(r.data); DB.clientes.sort(porCriado); } }
  });
  Object.keys(NV.last).forEach(id=>{ if(!(id in rem)&&id!==CFG_ID){ DB.clientes=DB.clientes.filter(c=>c.id!==id); mudou=true; } });
  NV.last=rem;
  if(mudou){ render(); toast('Atualizado com as mudanças da equipe'); }
}

  const cfg=rows.find(r=>r.id===CFG_ID);

  NV.pronto=true; gate(null); syncTag('Salvo na nuvem'); go('clientes');

  NV.sb.channel('nms-diagnostico').on('postgres_changes',{event:'*',schema:'public',table:'nms_diagnostico'},()=>agendarPuxar()).subscribe();

  window.addEventListener('beforeunload',e=>{ if(NV.saveT||NV.busy){ e.preventDefault(); e.returnValue=''; } });
}

/* ---------------- cálculos: diagnóstico ---------------- */
function calcDiag(d){
  const cfg = DB.config;
  const fat = n(d.faturamento);
  const impostos = fat*n(d.impostosPct)/100;
  const recLiq = fat-impostos;
  const cv = n(d.custosVar)+n(d.taxas);
  const mc = recLiq-cv;
  const mcPct = fat>0? mc/fat : null;
  const fixas = n(d.folha)+n(d.prolabore)+n(d.aluguel)+n(d.outrasFixas);
  const ebitda = mc-fixas;
  const parcelas = n(d.parcelas);
  const resultado = ebitda-parcelas;
  const r = {fat,impostos,recLiq,cv,mc,mcPct,fixas,ebitda,parcelas,resultado,preenchido: fat>0};
  r.margem = fat>0? resultado/fat : null;
  r.pe = (mcPct&&mcPct>0)? fixas/mcPct : null;               // ponto de equilíbrio (faturamento)
  r.peComDividas = (mcPct&&mcPct>0)? (fixas+parcelas)/mcPct : null;
  r.folgaPE = (r.peComDividas&&r.peComDividas>0)? fat/r.peComDividas-1 : (fat>0 && mcPct>0 ? 1 : null);
  const saidasFixas = fixas+parcelas;
  r.folego = has(d.caixa) && saidasFixas>0 ? n(d.caixa)/saidasFixas : null;
  r.liquidez = has(d.pagar30) && n(d.pagar30)>0 ? (n(d.caixa)+n(d.receber30))/n(d.pagar30) : null;
  r.endivMeses = has(d.dividaTotal) && fat>0 ? n(d.dividaTotal)/fat : null;
  r.caixa = n(d.caixa);

  // pontuação 0-100
  const vals = {margem: r.margem==null?null:r.margem*100, folego:r.folego, liquidez:r.liquidez, endiv:r.endivMeses, equilibrio: r.folgaPE==null?null:r.folgaPE*100};
  if(fat>0 && mcPct!==null && mcPct<=0) vals.equilibrio = -100; // margem de contribuição negativa: nunca atinge o equilíbrio
  let soma=0, pesos=0; r.ind={};
  for(const k in cfg.indicadores){
    const ic=cfg.indicadores[k], info=IND_INFO[k], v=vals[k];
    if(v==null||!fat){ r.ind[k]={valor:null,nota:null}; continue; }
    const c=ic.c.map(Number); let nota;
    if(info.dir>0) nota = v>=c[0]?100: v>=c[1]?75: v>=c[2]?50: v>=c[3]?25:0;
    else           nota = v<=c[0]?100: v<=c[1]?75: v<=c[2]?50: v<=c[3]?25:0;
    r.ind[k]={valor:v,nota}; soma+=nota*n(ic.peso); pesos+=n(ic.peso);
  }
  r.score = pesos>0? Math.round(soma/pesos) : null;

  // pontos de atenção
  const al=[];
  if(fat>0){
    if(r.resultado<0) al.push('Fecha o mês no prejuízo: '+brl(r.resultado)+'.');
    if(mcPct!==null && mcPct<0.25 && mcPct>0) al.push('Margem de contribuição baixa ('+pct(mcPct)+'): sobra pouco de cada venda para pagar as despesas fixas.');
    if(mcPct!==null && mcPct<=0) al.push('Os custos variáveis e impostos consomem toda a receita: cada venda dá prejuízo.');
    if(r.folego!==null && r.folego<1) al.push('O dinheiro em conta não paga nem um mês de contas fixas.');
    if(r.liquidez!==null && r.liquidez<1) al.push('O que vai entrar nos próximos 30 dias não paga o que vai vencer.');
    if(r.endivMeses!==null && r.endivMeses>6) al.push('Dívida equivale a '+num(r.endivMeses)+' meses de faturamento.');
    if(n(d.prolabore)===0 && r.fixas>0) al.push('Pró-labore zerado: o dono pode estar tirando dinheiro sem controle.');
  }
  const ck=d.checks||{};
  const ALERTA={separaPF:'Mistura a conta pessoal com a da empresa.',temControle:'Não tem controle financeiro.',sabeLucro:'Não sabe se teve lucro.',pagaJuros:'Paga juros e multa por atraso.',inadimplencia:'Tem clientes que atrasam.',usaLimite:'Usa o cheque especial.'};
  for(const q of CHECKS){ if(ck[q.k] && ck[q.k]!==q.bom) al.push(ALERTA[q.k]||q.t); }
  r.alertas=al;
  return r;
}

/* ---------------- cálculos: precificação ---------------- */
function volumeDe(d, vol){
  if(vol==='pagar') return n(d.lancPagar);
  if(vol==='receber') return n(d.lancReceber);
  if(vol==='contas') return n(d.contasBancarias);
  return 0;
}
const VOL_NOME={pagar:'lançamentos a pagar/mês',receber:'recebimentos/mês',contas:'contas bancárias',"":'—'};
function complexSugerida(d){
  const a=DB.config.complexAuto, f=n(d.faturamento), fu=n(d.funcionarios);
  if(f>=a.fatAlta || fu>=a.funcAlta) return 'alta';
  if(f>=a.fatMedia || fu>=a.funcMedia) return 'media';
  return 'baixa';
}
function calcPreco(c){
  const cfg=DB.config, d=c.diag, p=c.preco;
  const linhas=[];
  for(const s of cfg.servicos){
    if(!p.servicos.includes(s.id)) continue;
    const vol = volumeDe(d,s.volume);
    const excedente = s.volume? Math.max(0, vol-n(s.incluso)) : 0;
    const valorExtra = excedente*n(s.extra);
    linhas.push({s, vol, excedente, valorExtra, base:n(s.preco), total:n(s.preco)+valorExtra});
  }
  const subtotal = linhas.reduce((a,l)=>a+l.total,0);
  const cx = p.complexidade==='auto'? complexSugerida(d) : p.complexidade;
  const fator = n(cfg.complexidade[cx])||1;
  const qtd = linhas.length;
  const pacPct = qtd>=4? n(cfg.pacote.d4) : qtd===3? n(cfg.pacote.d3) : qtd===2? n(cfg.pacote.d2) : 0;
  const comFator = subtotal*fator;
  const descPacote = comFator*pacPct/100;
  const manPct = Math.min(Math.max(n(p.descontoManual),0),100);
  // modelo NMS: fixo + % do valor recebido por mês + adicionais de serviço (se houver)
  const fixo = qtd? n(cfg.fixoMensal) : 0;
  const varPct = n(cfg.variavelPct);
  let variavel = qtd? n(d.faturamento)*varPct/100 : 0;
  const varTetoAplicado = n(cfg.variavelTeto)>0 && variavel>n(cfg.variavelTeto);
  if(varTetoAplicado) variavel = n(cfg.variavelTeto);
  const adicionais = comFator-descPacote;
  const bruto = fixo+variavel+adicionais;
  const descManual = bruto*manPct/100;
  let mensal = bruto-descManual;
  const arr = n(cfg.arredondar)||1;
  mensal = qtd? Math.ceil(mensal/arr)*arr : 0;
  let minimoAplicado=false;
  if(qtd && mensal<n(cfg.minimoMensal)){ mensal=n(cfg.minimoMensal); minimoAplicado=true; }
  const mensalCalculado = mensal;
  const mensalManualOn = !!qtd && has(p.mensalManual) && n(p.mensalManual)>0;
  if(mensalManualOn){ mensal = n(p.mensalManual); minimoAplicado=false; }
  const implantacao = qtd? Math.ceil(Math.max(n(cfg.implantacaoMin), mensal*n(cfg.implantacaoPct)/100)/arr)*arr : 0;
  const horas = linhas.reduce((a,l)=>a+n(l.s.horas),0)*fator;
  const custo = horas*n(cfg.custoHora);
  const margem = mensal>0? (mensal-custo)/mensal : null;
  // oferta de entrada: X primeiros meses com desconto e implantação fixa
  const ofCfg=cfg.oferta||{};
  const ofOn = !!qtd && n(ofCfg.meses)>0 && (p.oferta===undefined? !!ofCfg.ativa : !!p.oferta);
  const mesesOf = ofOn? n(ofCfg.meses) : 0;
  const ofPct = ofOn? Math.min(Math.max(n(ofCfg.descontoPct),0),100) : 0;
  const mensalOferta = ofOn? Math.ceil(mensal*(1-ofPct/100)/arr)*arr : mensal;
  const implantacaoTabela = implantacao;
  let implantacaoFinal = ofOn && n(ofCfg.implantacao)>0 ? n(ofCfg.implantacao) : implantacao;
  const implantacaoCalculada = implantacaoFinal;
  const implManualOn = !!qtd && has(p.implantacaoManual) && n(p.implantacaoManual)>=0 && p.implantacaoManual!=='';
  if(implManualOn) implantacaoFinal = n(p.implantacaoManual);
  const total12 = qtd? implantacaoFinal + mensalOferta*Math.min(mesesOf,12) + mensal*Math.max(0,12-mesesOf) : 0;
  const economiaOferta = ofOn? (mensal-mensalOferta)*mesesOf + Math.max(0,implantacaoTabela-implantacaoFinal) : 0;
  const margemOferta = ofOn && mensalOferta>0? (mensalOferta-custo)/mensalOferta : margem;
  const avisos=[];
  if(qtd && !n(d.faturamento)) avisos.push('Falta o faturamento no diagnóstico: sem ele a parte variável fica zerada.');
  if(ofOn && margemOferta!==null && margemOferta<0) avisos.push('Durante a oferta (meses 1 a '+mesesOf+') a NMS fica abaixo do custo: margem de '+pct(margemOferta)+'. É o investimento para ganhar o cliente.');
  if(manPct>n(cfg.descontoMax)) avisos.push('Desconto manual acima do limite de '+num(n(cfg.descontoMax),0)+'%.');
  if(margem!==null && margem*100<n(cfg.margemMin)) avisos.push('Margem da NMS ('+pct(margem)+') abaixo do mínimo de '+num(n(cfg.margemMin),0)+'%.');
  if(minimoAplicado) avisos.push('Aplicada a mensalidade mínima de '+brl(n(cfg.minimoMensal))+'.');
  const faltaVolume = linhas.filter(l=>l.s.volume && n(l.s.extra)>0 && !has(d[{pagar:'lancPagar',receber:'lancReceber',contas:'contasBancarias'}[l.s.volume]]));
  if(faltaVolume.length) avisos.push('Falta informar o volume no diagnóstico para: '+faltaVolume.map(l=>l.s.nome).join(', ')+'.');
  return {mensalCalculado,mensalManualOn,implantacaoCalculada,implManualOn,fixo,variavel,varPct,varTetoAplicado,adicionais,bruto,linhas,subtotal,cx,fator,qtd,pacPct,comFator,descPacote,manPct,descManual,mensal,implantacao:implantacaoFinal,implantacaoTabela,ofOn,mesesOf,ofPct,mensalOferta,total12,economiaOferta,margemOferta,horas,custo,margem,avisos};
}

/* ---------------- cálculos: capacidade de pagamento ---------------- */
function calcCapacidade(r, mensal){
  const cap=DB.config.capacidade;
  if(!r.preenchido) return null;
  const tetoRes = Math.max(0, r.resultado*n(cap.limiteResultadoPct)/100);
  const tetoFat = r.fat*n(cap.limiteFaturamentoPct)/100;
  const teto = Math.min(tetoRes, tetoFat);
  const sobra = r.resultado-mensal;
  const comprometimento = r.resultado>0? mensal/r.resultado : null;
  const ganho = r.fat*n(cap.ganhoPct)/100;
  const retorno = ganho-mensal;
  const roi = mensal>0? ganho/mensal : null;
  let t, titulo, texto;
  const folegoOk = r.folego==null || r.folego>=n(cap.folegoMin);
  if(!mensal){ t='plain'; titulo='Selecione os serviços'; texto='Teto sugerido de mensalidade para este cliente: '+brl(teto)+'.'; }
  else if(r.resultado<=0){ t='bad'; titulo='Não cabe no caixa hoje'; texto='A empresa já fecha o mês no prejuízo. A mensalidade aumentaria o rombo. Avalie começar só pelo essencial (fluxo de caixa) ou um plano de reorganização.'; }
  else if(mensal<=teto && sobra>0 && folegoOk){ t='ok'; titulo='Cabe no caixa'; texto='A mensalidade usa '+pct(comprometimento)+' do resultado mensal e ainda sobram '+brl(sobra)+' por mês para a empresa.'; }
  else if(sobra>0 && mensal<=teto){ t='warn'; titulo='Cabe, mas o caixa está curto'; texto='A mensalidade cabe na sobra do mês ('+pct(comprometimento)+' dela), mas o caixa de hoje cobre menos de '+num(n(cap.folegoMin),1)+' mês de despesas fixas. Considere parcelar a implantação.'; }
  else if(sobra>0 && mensal<=teto*1.3){ t='warn'; titulo='Cabe, mas apertado'; texto='A mensalidade passa um pouco do teto recomendado ('+brl(teto)+'). '+(folegoOk?'':'O fôlego de caixa também está curto. ')+'Considere reduzir o escopo ou parcelar a implantação.'; }
  else if(sobra>0){ t='bad'; titulo='Acima da capacidade'; texto='A mensalidade compromete '+pct(comprometimento)+' do resultado. O teto recomendado é '+brl(teto)+'. Reduza o escopo.'; }
  else { t='bad'; titulo='Não cabe no caixa'; texto='Depois da mensalidade a empresa ficaria no prejuízo. Teto recomendado: '+brl(teto)+'.'; }
  return {teto,tetoRes,tetoFat,sobra,comprometimento,ganho,retorno,roi,t,titulo,texto};
}

/* ---------------- navegação ---------------- */
function go(name,id,tab){
  view.name=name; if(id!==undefined) view.id=id; if(tab) view.tab=tab;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===(name==='cliente'?'clientes':name)));
  render(); window.scrollTo(0,0);
}
function render(){
  const app=document.getElementById('app');
  if(view.name==='cliente' && cliente()) app.innerHTML=vCliente();
  else if(view.name==='config') app.innerHTML=vConfig();
  else if(view.name==='backup') app.innerHTML=vBackup();
  else { view.name='clientes'; app.innerHTML=vClientes(); }
  refreshLive();
}

      <div class="hide-m n" style="text-align:right;font-weight:600">${p.qtd?brl(p.mensal)+'<span class="muted small">/mês</span>':'<span class="muted small">Sem proposta</span>'}</div>

/* campos ligados ao cliente: data-b="caminho" ; data-num para números */
function fld(label, path, opt={}){
  const c=cliente(); const v=getPath(c,path);
  const t=opt.type||'text';
  let input;
  if(opt.options) input=`<select data-b="${path}">${opt.options.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
  else if(t==='textarea') input=`<textarea data-b="${path}" placeholder="${esc(opt.ph||'')}">${esc(v)}</textarea>`;
  else if(t==='money'){
    input=`<div class="money"><input type="text" inputmode="decimal" data-b="${path}" data-num="1" data-money="1" value="${v==null?'':fmtNum(v)}" placeholder="${esc(opt.ph||'0')}"></div>`;
  }
  else if(t==='pct'||t==='int'){
    const inp=`<input type="number" data-b="${path}" data-num="1" step="${t==='int'?1:'any'}" min="0" value="${v==null?'':v}" placeholder="${esc(opt.ph||'')}">`;
    input = t==='money'?`<div class="money">${inp}</div>`: t==='pct'?`<div class="pct">${inp}</div>`: inp;
  }
  else input=`<input type="${t}" data-b="${path}" value="${esc(v)}" placeholder="${esc(opt.ph||'')}">`;
  return `<label class="f" ${opt.span?'style="grid-column:1/-1"':''}>${label}${opt.help?` <small>${opt.help}</small>`:''}${input}</label>`;
}

function liveDiag(c){
  const r=calcDiag(c.diag);
  if(!r.preenchido) return `<h2>Resultado</h2><p class="muted">Preencha quanto entra por mês para ver o resultado.</p>`;
  const t=tone(r.score);
  const frase={ok:'As contas estão em ordem.',warn:'Dá para melhorar alguns pontos.',bad:'Precisa de cuidado agora.',plain:''}[t];
  const nomeStatus={ok:'Empresa saudável',warn:'Precisa de atenção',bad:'Situação crítica',plain:'Sem dados'}[t];
  const dias = r.folego==null? null : Math.round(r.folego*30);
  return `<div class="status ${t}"><div class="sc ${t}">${r.score??'—'}</div><div class="tx"><b>${nomeStatus}</b><span>${frase}</span></div></div>
  <div class="big3">
    <div class="bn"><div class="l">Sobra por mês</div><div class="v ${r.resultado<0?'bad':''}">${brl(r.resultado)}</div><div class="s">${r.margem==null?'':'R$ '+num(r.margem*100,0)+' de cada R$ 100 vendidos'}</div></div>
    <div class="bn"><div class="l">O dinheiro em conta aguenta</div><div class="v ${dias!=null&&dias<30?'bad':''}">${dias==null?'—':dias+' dias'}</div><div class="s">pagando as contas fixas sem vender nada</div></div>
    <div class="bn"><div class="l">Precisa vender no mínimo</div><div class="v">${r.peComDividas==null?'—':brl(r.peComDividas)}</div><div class="s">por mês para não ter prejuízo</div></div>
  </div>
  ${r.alertas.length?`<h3>Atenção</h3><ul class="alerts">${r.alertas.slice(0,4).map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:''}
  <details class="more" style="margin-top:14px"><summary>Ver detalhes</summary>${indicadoresHTML(r)}<h3>Conta do mês</h3>${dreHTML(r)}</details>`;
}
function indicadoresHTML(r){
  return Object.keys(IND_INFO).map(k=>{
    const info=IND_INFO[k], x=r.ind[k]||{};
    const v=x.valor==null?'—': info.un==='%'?num(x.valor)+'%': info.un==='x'?num(x.valor,2)+'x': num(x.valor)+' '+info.un;
    const t=x.nota==null?'plain':x.nota>=75?'ok':x.nota>=50?'warn':'bad';
    return `<div class="ind"><div class="row"><span>${info.nome}</span><span class="v ${t}">${v}</span></div>
      <div class="meter"><span style="width:${x.nota??0}%;background:${COLORS[t]}"></span></div><p>${info.exp}</p></div>`;
  }).join('');
}
function dreHTML(r){
  return `<div class="kv"><span>Faturamento</span><b>${brl(r.fat)}</b></div>
  <div class="kv"><span>(−) Impostos</span><b>${brl(-r.impostos)}</b></div>
  <div class="kv"><span>(−) Custos variáveis</span><b>${brl(-r.cv)}</b></div>
  <div class="kv"><span>= Margem de contribuição <span class="muted small">(${pct(r.mcPct)})</span></span><b>${brl(r.mc)}</b></div>
  <div class="kv"><span>(−) Despesas fixas</span><b>${brl(-r.fixas)}</b></div>
  <div class="kv"><span>= EBITDA <span class="muted small">(resultado da operação)</span></span><b class="${r.ebitda<0?'bad':''}">${brl(r.ebitda)}</b></div>
  <div class="kv"><span>(−) Parcelas de dívidas</span><b>${brl(-r.parcelas)}</b></div>
  <div class="kv"><span><b>= Sobra no mês</b></span><b class="${r.resultado<0?'bad':'ok'}">${brl(r.resultado)}</b></div>

}

function ajustaValor(campo,acao){
  const c=cliente(), p=c.preco, pr=calcPreco(c), cap=calcCapacidade(calcDiag(c.diag),pr.mensal);
  if(acao==='reset'){ p.mensalManual=null; p.implantacaoManual=null; }
  else if(acao==='teto'){ if(!cap||!cap.teto){ toast('Preencha o diagnóstico para ter o teto'); return; } p.mensalManual=Math.floor(cap.teto/10)*10; }
  else { const atual = campo==='mensalManual'? pr.mensal : pr.implantacao; p[campo]=Math.max(0, atual+acao); }
  const im=document.getElementById('in-mensal'), ii=document.getElementById('in-impl');
  if(im) im.value=has(p.mensalManual)?fmtNum(p.mensalManual):''; if(ii) ii.value=has(p.implantacaoManual)?fmtNum(p.implantacaoManual):'';
  touch(); refreshLive();
}
function toggleSvc(id,on){
  const p=cliente().preco; p.servicos=p.servicos.filter(x=>x!==id); if(on) p.servicos.push(id);
  // mantém a ordem da configuração
  const ordem=DB.config.servicos.map(s=>s.id); p.servicos.sort((a,b)=>ordem.indexOf(a)-ordem.indexOf(b));
  touch(); refreshLive();
}

function prop(c){ // dados da proposta com valores-padrão
  const pd=DB.config.propostaPadrao;
  if(!c.proposta) c.proposta={};
  const p=c.proposta;
  if(!p.numero){ const d=new Date(); p.numero=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+'-'+c.id.slice(-3).toUpperCase(); }
  if(!p.data) p.data=new Date().toISOString().slice(0,10);
  for(const k of ['validadeDias','prazoImplantacao','vencimento','formaPagamento','contrato','duracaoMeses']) if(p[k]===undefined||p[k]===null||p[k]==='') p[k]=pd[k];
  if(!p.inicio){ const d=new Date(p.data+'T12:00'); d.setMonth(d.getMonth()+1,1); p.inicio=d.toISOString().slice(0,10); } // padrão: dia 1 do mês seguinte
  if(p.mostrarOpp===undefined) p.mostrarOpp=true;
  if(p.mostrarAceite===undefined) p.mostrarAceite=true;
  if(p.mostrarClausulas===undefined) p.mostrarClausulas=true;
  if(!has(p.diaRelatorio)) p.diaRelatorio=pd.diaRelatorio;
  return p;
}
function dataBR(iso){ return iso? new Date(iso+'T12:00').toLocaleDateString('pt-BR') : ''; }
function isoDe(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function somaDias(iso,dias){ const d=new Date(iso+'T12:00'); d.setDate(d.getDate()+dias); return isoDe(d); }
function terminoContrato(inicio,meses){ // início + N meses − 1 dia
  if(!inicio||!n(meses)) return ''; const d=new Date(inicio+'T12:00'); const dia=d.getDate();
  d.setDate(1); d.setMonth(d.getMonth()+n(meses)); const ult=new Date(d.getFullYear(),d.getMonth()+1,0,12).getDate(); d.setDate(Math.min(dia,ult)); d.setDate(d.getDate()-1); return isoDe(d); }
function contratoAtual(c){ const l=(c.contratos||[]); return l.length? l[l.length-1] : null; }
function diasAte(iso){ return Math.round((new Date(iso+'T12:00')-new Date(isoDe(new Date())+'T12:00'))/864e5); }

function ren(c){
  if(!c.renovacao) c.renovacao={};
  const R=c.renovacao, atual=contratoAtual(c), pd=DB.config.propostaPadrao;
  if(!R.fimAtual) R.fimAtual = atual&&atual.termino ? atual.termino : (c.proposta&&c.proposta.inicio? terminoContrato(c.proposta.inicio, c.proposta.duracaoMeses||pd.duracaoMeses) : '');
  if(!n(R.meses)) R.meses = n(pd.duracaoMeses)||6;
  if(!R.data) R.data = isoDe(new Date());
  if(!R.numero){ const d=new Date(); R.numero='R'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+'-'+c.id.slice(-3).toUpperCase(); }
  if(!R.vencimento) R.vencimento = (c.proposta&&c.proposta.vencimento)||pd.vencimento;
  if(!R.formaPagamento) R.formaPagamento = (c.proposta&&c.proposta.formaPagamento)||pd.formaPagamento;
  return R;
}
function renCalc(c){
  const R=ren(c), pr=calcPreco(c);
  const inicio = R.fimAtual? somaDias(R.fimAtual,1) : '';
  const termino = terminoContrato(inicio, R.meses);
  const mensal = has(R.mensal)&&n(R.mensal)>0 ? n(R.mensal) : pr.mensal;
  return {R,pr,inicio,termino,mensal};
}

function gerarRenovacao(){
  const c=cliente(); const {R,inicio,termino,mensal}=renCalc(c);
  c.contratos=c.contratos||[];
  const reg={tipo:'Renovação', inicio, termino, meses:n(R.meses), mensal, implantacao:0, documento:R.numero, gerado:isoDe(new Date())};
  const i=c.contratos.findIndex(x=>x.documento===R.numero); if(i>=0) c.contratos[i]=reg; else c.contratos.push(reg);
  c.status='Fechado'; touch();
  const t=document.title; document.title='Renovação NMS - '+nomeCliente(c)+' - '+R.numero;
  setTimeout(()=>{ window.print(); setTimeout(()=>{ document.title=t; c.renovacao={}; save(); render(); },500); },50);
}
function gerarPDF(){
  const c=cliente(); const p=prop(c); save();
  const t=document.title; document.title='Proposta NMS - '+nomeCliente(c)+' - '+p.numero;
  if(c.status==='Prospecção'||c.status==='Diagnóstico feito'){ c.status='Proposta enviada'; }
  // registra/atualiza o contrato inicial no histórico
  const pr=calcPreco(c); c.contratos=c.contratos||[];
  const ini={tipo:'Inicial', inicio:p.inicio, termino:terminoContrato(p.inicio,p.duracaoMeses), meses:n(p.duracaoMeses), mensal:pr.mensal, implantacao:pr.implantacao, documento:p.numero, gerado:isoDe(new Date())};
  const i=c.contratos.findIndex(x=>x.tipo==='Inicial'); if(i>=0) c.contratos[i]=ini; else c.contratos.unshift(ini);
  touch();
  setTimeout(()=>{ window.print(); setTimeout(()=>{document.title=t; render();},500); },50);
}

    L.push('*Serviços:*'); pr.linhas.forEach(l=>L.push('• '+l.s.nome));
    L.push('');
    if(pr.ofOn){ L.push('*Oferta de entrada:* '+pr.mesesOf+' primeiras mensalidades por '+brl(pr.mensalOferta)+' ('+num(pr.ofPct,0)+'% de desconto)'); L.push('*A partir do '+(pr.mesesOf+1)+'º mês:* '+brl(pr.mensal)); }
    else L.push('*Mensalidade:* '+brl(pr.mensal));
    L.push('*Implantação:* '+brl(pr.implantacao));
    if(cap&&cap.ganho) L.push('Retorno estimado com a organização: '+brl(cap.ganho)+'/mês');
  }
  if(c.preco.obs){L.push('');L.push(c.preco.obs);}
  const txt=L.join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Texto copiado'),()=>{prompt('Copie o texto:',txt)});
}

/* ---------------- tela: configurações ---------------- */
function cf(path,type='num',extra=''){
  const v=getPath(DB.config,path);
  if(type==='text') return `<input type="text" data-c="${path}" value="${esc(v)}" ${extra}>`;
  return `<input type="number" step="any" min="0" data-c="${path}" data-num="1" value="${v}" ${extra}>`;
}

function removerSvc(i){
  const s=DB.config.servicos[i]; const usado=DB.clientes.some(c=>c.preco.servicos.includes(s.id));
  if(!confirm(usado?'"'+s.nome+'" está em propostas de clientes. Remover mesmo assim? (Prefira desmarcar "Ativo".)':'Remover "'+s.nome+'"?')) return;
  DB.config.servicos.splice(i,1); DB.clientes.forEach(c=>c.preco.servicos=c.preco.servicos.filter(x=>x!==s.id)); save(); render();
}

/* ---------------- tela: backup ---------------- */
function vBackup(){
  const ult=DB.ultimoBackup?new Date(DB.ultimoBackup).toLocaleString('pt-BR'):'nunca';
  return `<h1 style="margin-bottom:6px">Backup</h1>
  <p class="muted" style="margin-top:0">Os dados ficam salvos na nuvem do NMS e aparecem para você e para o Kayan em qualquer aparelho. O backup é uma cópia extra em arquivo e também serve para trazer os clientes da versão antiga em HTML (exporte lá e importe aqui). Último backup: <b>${ult}</b>.</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px">
    <div class="card"><h2>Exportar</h2><p class="muted small">Gera um arquivo .json com todos os clientes e as configurações.</p>
      <button class="btn" onclick="exportar()">Baixar backup (.json)</button>
      <button class="btn ghost" style="margin-top:8px" onclick="exportarCSV()">Planilha de clientes (.csv)</button></div>
    <div class="card"><h2>Importar</h2><p class="muted small">Carrega um backup. Você escolhe se junta com os dados atuais ou substitui tudo.</p>
      <input type="file" accept=".json,application/json" onchange="importar(this.files[0]);this.value=''"></div>
    <div class="card"><h2>Clientes de exemplo</h2><p class="muted small">Carrega (ou recarrega) os dois clientes fictícios, Cliente Teste e Clínica Sorriso, com diagnóstico e proposta prontos.</p>
      <button class="btn ghost" onclick="carregarTeste()">Carregar clientes de exemplo</button></div>
  </div>`;
}
function baixar(nome, conteudo, tipo){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo})); a.download=nome; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function exportar(){
  DB.ultimoBackup=new Date().toISOString(); save();
  baixar('nms-diagnostico-backup-'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(DB,null,2), 'application/json');
  setTimeout(render,200);
}
function exportarCSV(){
  const cols=['Cliente','CNPJ','Segmento','Cidade','Responsável','Telefone','Status','Faturamento','Sobra no mês','Nota saúde','Classificação','Serviços','Mensalidade','Mensalidade na oferta','Meses de oferta','Implantação','Margem NMS','Cabe no caixa'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const f2=v=>(v==null||!isFinite(v))?'':v.toFixed(2).replace('.',',');
  const rows=DB.clientes.map(c=>{const r=calcDiag(c.diag),p=calcPreco(c),cap=calcCapacidade(r,p.mensal);
    return [nomeCliente(c),c.cadastro.cnpj,c.cadastro.segmento,c.cadastro.cidade,c.cadastro.responsavel,c.cadastro.telefone,c.status,f2(r.fat),f2(r.resultado),r.score??'',toneLabel(r.score),p.linhas.map(l=>l.s.nome).join(' + '),f2(p.mensal),p.ofOn?f2(p.mensalOferta):'',p.mesesOf||'',f2(p.implantacao),p.margem==null?'':f2(p.margem*100)+'%',cap?cap.titulo:''].map(q).join(';')});
  baixar('nms-clientes-'+new Date().toISOString().slice(0,10)+'.csv','﻿'+[cols.map(q).join(';'),...rows].join('\r\n'),'text/csv;charset=utf-8');
}
function importar(file){
  if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{
    let d; try{ d=JSON.parse(rd.result); }catch(e){ alert('Arquivo inválido.'); return; }
    if(!d||!Array.isArray(d.clientes)){ alert('Este arquivo não é um backup do NMS Diagnóstico.'); return; }
    const substituir=confirm('Backup com '+d.clientes.length+' cliente(s).\n\nOK = SUBSTITUIR tudo (clientes e configurações) pelo backup.\nCancelar = JUNTAR com os dados atuais (clientes do backup atualizam os de mesmo cadastro).');
    if(substituir){ DB={versao:1,clientes:d.clientes,config:mergeDefaults(DEFAULT_CONFIG,d.config),ultimoBackup:d.ultimoBackup||null}; }
    else { d.clientes.forEach(c=>{const i=DB.clientes.findIndex(x=>x.id===c.id); if(i>=0){ if((c.atualizado||'')>(DB.clientes[i].atualizado||'')) DB.clientes[i]=c; } else DB.clientes.push(c);}); }
    save(); toast('Backup importado'); go('clientes');
  };
  rd.readAsText(file);
}

/* ---------------- atualização ao digitar ---------------- */
function refreshLive(){
  const c=cliente();
  const ld=document.getElementById('live-diag'); if(ld&&c) ld.innerHTML=liveDiag(c);
  const lp=document.getElementById('live-preco'); if(lp&&c) lp.innerHTML=livePreco(c);
  const nm=document.getElementById('cl-nome'); if(nm&&c) nm.textContent=nomeCliente(c);
  const pd=document.getElementById('prop-doc'); if(pd&&c) pd.innerHTML=propostaDoc(c);
  const rm=document.getElementById('ref-mensal'), ri=document.getElementById('ref-impl');
  if((rm||ri)&&c){ const pr=calcPreco(c), cap=calcCapacidade(calcDiag(c.diag),pr.mensal);
    const im=document.getElementById('in-mensal'), ii=document.getElementById('in-impl');
    if(im) im.placeholder=fmtNum(pr.mensalCalculado); if(ii) ii.placeholder=fmtNum(pr.implantacaoCalculada);
    if(rm) rm.innerHTML=`Calculado: ${brl(pr.mensalCalculado)} · Teto do cliente: <b>${cap?brl(cap.teto):'—'}</b>${pr.mensalManualOn?' · <b class="warn">ajustado</b>':''}`;
    if(ri) ri.innerHTML=`Calculado: ${brl(pr.implantacaoCalculada)}${pr.implManualOn?' · <b class="warn">ajustado</b>':''}`; }
  const rd=document.getElementById('ren-doc'); if(rd&&c) rd.innerHTML=renovacaoDoc(c);
  const mb=document.getElementById('mbar'), app=document.getElementById('app');
  let h='';
  if(c && view.name==='cliente' && view.tab==='diag'){ const r=calcDiag(c.diag); h = r.preenchido? `<span class="badge ${tone(r.score)}">${r.score} · ${toneLabel(r.score)}</span><span class="small muted">Sobra ${brl(r.resultado)}/mês</span><button class="btn sm" onclick="document.getElementById('live-diag').scrollIntoView({behavior:'smooth'})">Ver resultado</button>`:''; }
  if(c && view.name==='cliente' && view.tab==='preco'){ const pr=calcPreco(c); h = pr.qtd? `<div><div class="mv">${brl(pr.mensal)}<span class="small muted">/mês</span></div><div class="small muted">Implantação ${brl(pr.implantacao)}</div></div><button class="btn sm" onclick="document.getElementById('live-preco').scrollIntoView({behavior:'smooth'})">Ver preço</button>`:''; }
  mb.innerHTML=h; mb.style.visibility=h?'visible':'hidden'; app.classList.toggle('has-mbar',!!h);
}
function telaCheia(){
  const d=document, el=d.documentElement;
  const on = d.fullscreenElement||d.webkitFullscreenElement;
  try{
    if(on) (d.exitFullscreen||d.webkitExitFullscreen).call(d);
    else (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
  }catch(e){ toast('Este navegador não permite tela cheia'); }
}
if(!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen)){ document.addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('fsbtn'); if(b) b.style.display='none';}); }
function onField(e){
  const el=e.target;
  if(el.dataset.b){
    const c=cliente(); if(!c) return;
    let v = el.type==='checkbox'? el.checked : el.value; if(el.dataset.money) v = parseNum(v); else if(el.dataset.num) v = v===''?null:+v;
    setPath(c, el.dataset.b, v); touch(); refreshLive();
  } else if(el.dataset.c){
    let v = el.type==='checkbox'? el.checked : el.value;
    if(el.dataset.num) v = v===''?0:+v;
    setPath(DB.config, el.dataset.c, v); save();
    if(el.tagName==='SELECT'||el.type==='checkbox') render();
  }
}
document.addEventListener('input', onField);
document.addEventListener('keydown', e=>{
  const el=e.target; if(e.key!=='Enter'||el.tagName!=='INPUT'||!el.dataset.b) return;
  const all=[...document.querySelectorAll('#app input[data-b]:not([type=checkbox]),#app textarea[data-b]')]; const i=all.indexOf(el);
  if(i>=0&&all[i+1]){ e.preventDefault(); all[i+1].focus(); all[i+1].select&&all[i+1].select(); }
});
document.addEventListener('focusout', e=>{ const el=e.target; if(el.dataset&&el.dataset.money){ el.value=fmtNum(parseNum(el.value)); } });
document.addEventListener('change', e=>{ if(e.target.tagName==='SELECT'||e.target.type==='checkbox') onField(e); });

nuvemIniciar();
</script>
