<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NMS Controle Financeiro</title>
<meta name="description" content="Controle financeiro pessoal e empresarial">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NMS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Montserrat:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="nms-cloud.js"></script>
</head>
<body>
<style>
/* Layout: corporativo preto e branco — barra lateral preta no computador, abas no rodapé no celular; números em mono tabular */
:root{
  --bg:#F5F5F4; --surface:#FFFFFF; --sunk:#ECECEB; --line:#D9D9D7;
  --fg:#0A0A0A; --muted:#6B6B69; --accent:#0A0A0A; --on-accent:#FFFFFF; --accent-soft:#E6E6E4;
  --nav-bg:#0A0A0A; --nav-fg:#FFFFFF; --nav-muted:#9A9A97; --nav-sel:#262626;
  --in:#1E8A55; --in-soft:#E4F0E9; --out:#B3261E; --out-soft:#F6E4E2; --warn:#7A5A00; --warn-soft:#F1EBDC;
  --c1:#2F5BEA; --c2:#E8892B; --c3:#1E9E62; --c4:#C2459B; --c5:#1597B8; --c6:#C9A227; --c7:#7B57E0; --c8:#E04A3A; --c9:#8C8C89; --c10:#0F766E; --c11:#A16207; --c12:#9D174D;
  --k-in:#1E9E62; --k-out:#E04A3A; --k-bal:#2F5BEA; --k-proj:#7B57E0;
  --f-display:"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-body:"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#0F0F0F; --sunk:#1A1A1A; --line:#2A2A2A;
  --fg:#F5F5F4; --muted:#9A9A97; --accent:#F5F5F4; --on-accent:#0A0A0A; --accent-soft:#222222;
  --nav-bg:#0F0F0F; --nav-fg:#F5F5F4; --nav-muted:#8A8A87; --nav-sel:#222222;
  --in:#5FC48E; --in-soft:#12261B; --out:#F2867D; --out-soft:#2C1513; --warn:#D9B45A; --warn-soft:#2A2312;
  --c1:#7C9BFF; --c2:#F5A75C; --c3:#4FCB8E; --c4:#E47FC4; --c5:#4FC6E0; --c6:#E3C35A; --c7:#A88CFF; --c8:#FF7A6B; --c9:#8A8A87; --c10:#3CC9B8; --c11:#E0A63A; --c12:#F06292;
  --k-in:#4FCB8E; --k-out:#FF7A6B; --k-bal:#7C9BFF; --k-proj:#A88CFF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0F0F0F; --sunk:#1A1A1A; --line:#2A2A2A;
  --fg:#F5F5F4; --muted:#9A9A97; --accent:#F5F5F4; --on-accent:#0A0A0A; --accent-soft:#222222;
  --nav-bg:#0F0F0F; --nav-fg:#F5F5F4; --nav-muted:#8A8A87; --nav-sel:#222222;
  --in:#5FC48E; --in-soft:#12261B; --out:#F2867D; --out-soft:#2C1513; --warn:#D9B45A; --warn-soft:#2A2312;
  --c1:#7C9BFF; --c2:#F5A75C; --c3:#4FCB8E; --c4:#E47FC4; --c5:#4FC6E0; --c6:#E3C35A; --c7:#A88CFF; --c8:#FF7A6B; --c9:#8A8A87; --c10:#3CC9B8; --c11:#E0A63A; --c12:#F06292;
  --k-in:#4FCB8E; --k-out:#FF7A6B; --k-bal:#7C9BFF; --k-proj:#A88CFF;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
@media (min-width:900px){.app{grid-template-columns:232px 1fr}}

/* barra lateral / rodapé */
.nav{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--nav-bg);color:var(--nav-fg);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.brand{display:none}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:var(--r);color:var(--nav-muted);font-size:12px;font-weight:500;letter-spacing:.02em}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--nav-fg)}
@media (min-width:900px){
  .nav{position:sticky;top:0;height:100vh;inset:auto;flex-direction:column;justify-content:flex-start;gap:2px;border-top:0;border-right:1px solid var(--line);padding:28px 14px;padding-left:max(14px,env(safe-area-inset-left,0px))}
  .brand{display:flex;align-items:center;gap:12px;padding:0 10px 28px}
  .brand .mark{min-width:40px;height:40px;padding:0 10px;border:2px solid var(--nav-fg);display:grid;place-items:center;font-weight:700;font-size:17px;letter-spacing:.04em}
  .brand small{display:block;font-weight:500;font-size:11px;color:var(--nav-muted);text-transform:uppercase;letter-spacing:.12em;line-height:1.3}
  .nav button{flex:none;flex-direction:row;gap:12px;font-size:14px;padding:11px 12px;justify-content:flex-start;border-left:2px solid transparent;border-radius:0}
  .nav button[aria-current="page"]{background:var(--nav-sel);border-left-color:var(--nav-fg)}
  .nav .sync{margin-top:auto;font-size:12px;color:var(--nav-muted);padding:0 10px}
}
.nav .sync{display:none}
@media (min-width:900px){.nav .sync{display:block}}

main{min-width:0;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){main{padding-block:28px 48px;padding-left:36px;padding-right:max(36px,env(safe-area-inset-right,0px))}}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-family:var(--f-display);font-weight:600;font-size:clamp(24px,5vw,32px);margin:0;letter-spacing:-.02em;text-wrap:balance}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.month button{width:34px;height:34px;border-radius:var(--r);border:0;background:none;font-size:18px;color:var(--muted)}
.month button:hover{background:var(--sunk)}
.month span{min-width:128px;text-align:center;font-weight:600;text-transform:capitalize}

.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--fg);border-radius:var(--r);padding:10px 14px;font-size:14px}
.banner b{color:var(--warn)}
.banner .sp{flex:1;min-width:160px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin:0 0 12px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

/* resumo */
.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (min-width:700px){.summary{grid-template-columns:repeat(4,minmax(0,1fr))}}
.summary > div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0;border-top:3px solid var(--k,var(--line))}
.summary .k-in{--k:var(--k-in)} .summary .k-out{--k:var(--k-out)} .summary .k-bal{--k:var(--k-bal)} .summary .k-proj{--k:var(--k-proj)}
.summary .k-bal .v{color:var(--k-bal)} .summary .k-proj .v{color:var(--k-proj)} .summary .v.neg{color:var(--k-out)}
.summary .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:clamp(17px,3.6vw,22px);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary .hint{font-size:12px;color:var(--muted)}
.pos{color:var(--in)} .neg{color:var(--out)}

.grid2{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:1000px){.grid2{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}
.agHero{border-top:3px solid var(--k-bal)}
.agProg{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.agBar{height:10px;background:var(--sunk);overflow:hidden}
.agBar i{display:block;height:100%;background:linear-gradient(90deg,var(--k-in),var(--k-bal))}
.agNums{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.agNums b{color:var(--fg);font-weight:500}
.agCards{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(168px,1fr);gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
@media (min-width:1000px){.agCards{grid-auto-flow:row;grid-template-columns:repeat(4,minmax(0,1fr))}}
.agCard{border:1px solid var(--line);border-top:3px solid var(--k);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;scroll-snap-align:start;background:var(--surface)}
.agDate{display:flex;align-items:baseline;gap:6px}
.agDate b{font-family:var(--f-num);font-size:28px;font-weight:500;color:var(--k);line-height:1}
.agDate span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.agTitle{background:none;border:0;padding:0;text-align:left;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agTitle:hover{text-decoration:underline}
.agMeta{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0}
.agFoot{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto}
.agCard .btn{justify-content:center}

/* categorias */
.donutRow{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:220px;height:220px;max-width:100%;flex:none;margin:0 auto}
.pieLbl{fill:#fff;font:600 13px var(--f-num);paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:3px;stroke-linejoin:round}
.cats{flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px}
.cat{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.dot{width:10px;height:10px;border-radius:3px}
.cat .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .bar{grid-column:2 / 4;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.cat .bar i{display:block;height:100%;border-radius:3px}
.cat .pct{color:var(--muted);font-size:12px;margin-left:6px}
.empty{color:var(--muted);font-size:14px;padding:18px 4px;text-align:center}

/* alimentação */
.food{display:flex;flex-direction:column;gap:12px}
.food .big{font-family:var(--f-num);font-size:26px;font-weight:500}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:13px}
.legend div{display:flex;gap:6px;align-items:center;min-width:0}
.legend span:last-child{margin-left:auto}
.cmp{font-size:13px;color:var(--muted)}

/* histórico */
.hist{width:100%;height:auto;display:block}
.hist text{fill:var(--muted);font-family:var(--f-body);font-size:11px}

/* listas */
.list{display:flex;flex-direction:column}
.day{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 2px 6px;display:flex;justify-content:space-between}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:hover{background:var(--sunk)}
.ico{width:36px;height:36px;border-radius:var(--r);display:grid;place-items:center;font-family:var(--f-num);font-weight:500;font-size:13px;background:var(--sunk);color:var(--fg);border:1px solid var(--line)}
.row .t{min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.chip{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--in-soft);color:var(--in)}
.chip.late{background:var(--out-soft);color:var(--out)}
.chip.soon{background:var(--warn-soft);color:var(--warn)}
.chip.ex{background:var(--accent-soft);color:var(--fg)}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{opacity:.86}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn.small{padding:6px 10px;font-size:13px}
.search{flex:1;min-width:160px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 12px}
select.search{flex:0 1 auto}

/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cal button{aspect-ratio:1;max-width:100%;border:1px solid transparent;background:var(--sunk);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--f-num);font-size:13px;padding:0}
.cal button.blank{visibility:hidden}
.cal button.today{border-color:var(--accent)}
.cal button.sel{background:var(--accent);color:var(--on-accent)}
.cal button.sel .pips i{box-shadow:0 0 0 1px var(--on-accent)}
.cal .pips{display:flex;gap:2px;height:5px}
.cal .pips i{width:5px;height:5px;border-radius:50%}
.calWrap{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:900px){.calWrap{grid-template-columns:minmax(0,340px) minmax(0,1fr)}}
.proj{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:14px}
.proj div{display:flex;justify-content:space-between}
.proj .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:600}

/* folha (modal) */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:var(--r) 8px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet{border-radius:var(--r);padding:24px}}
.sheet h3{font-family:var(--f-display);font-size:19px;font-weight:600;margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:var(--r);padding:3px}
.seg button{border:0;background:none;border-radius:3px;padding:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:10px 12px;width:100%}
.field input.money{font-family:var(--f-num);font-size:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.actions .sp{flex:1}
.note{font-size:13px;color:var(--muted)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.preview{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
.preview table{width:100%;border-collapse:collapse;font-size:13px}
.preview td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.preview td:nth-child(2){white-space:normal;min-width:120px}


/* calendário de capital */
.capHead{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.capHead{grid-template-columns:repeat(4,minmax(0,1fr))}}
.capHead div{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--k);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.capHead b{font-family:var(--f-num);font-weight:500;font-size:17px;color:var(--k);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcalBox{overflow-x:auto}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface)}
.mcal .wd{padding:8px 6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.mcal .cell{min-height:122px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;background:var(--heat,transparent)}
.mcal .cell.blank{background:var(--bg);cursor:default}
.mcal .cell:not(.blank):hover{box-shadow:inset 0 0 0 1px var(--fg)}
.mcal .cell.sel{box-shadow:inset 0 0 0 2px var(--fg)}
.mcal .dn{font-family:var(--f-num);font-size:12px;width:24px;height:24px;display:grid;place-items:center}
.mcal .cell.today .dn{background:var(--accent);color:var(--on-accent)}
.mcal .it{display:flex;gap:5px;align-items:center;font-size:11.5px;min-width:0;line-height:1.25}
.mcal .it i{width:6px;height:6px;border-radius:50%;flex:none}
.mcal .it span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mcal .it .a{margin-left:auto;flex:none;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.mcal .it.paid span:not(.a){text-decoration:line-through;color:var(--muted)}
.mcal .more{font-size:11px;color:var(--muted)}
.mcal .bal{margin-top:auto;font-family:var(--f-num);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.mcal .mob{display:none;font-family:var(--f-num);font-size:10px;line-height:1.2}
@media (max-width:699px){
  .mcal .cell{min-height:62px;padding:3px;gap:1px;align-items:center}
  .mcal .it,.mcal .more,.mcal .bal{display:none}
  .mcal .mob{display:block}

function localParse(text){
  const t = text.toLowerCase(), today = todayStr(), t2 = t.replace(/dia\s+\d{1,2}/, " ");
  const vm = t2.match(/(?:r\$\s*)?(\d{1,3}(?:\.\d{3})+|\d+)(?:,(\d{1,2}))?\s*(mil)?\s*(?:reais|real|conto|r\$)?/);
  if (!vm) return null;
  let valor = parseFloat(vm[1].replace(/\./g,"") + (vm[2] ? "." + vm[2] : "")); if (vm[3]) valor *= 1000;
  const dm = t.match(/dia\s+(\d{1,2})/); const entrada = /receb|ganh|entra|sal[aá]rio/.test(t);
  let data = today;
  if (dm) { const d = +dm[1]; let ym = ymOf(today); if (d < +today.slice(8)) ym = addMonths(ym, 1); data = `${ym}-${pad(Math.min(d, dim(ym)))}`; }
  else if (/amanh/.test(t)) { const d = new Date(); d.setDate(d.getDate()+1); data = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  const futuro = !!dm || /vou|vai|tenho que|preciso|vence|amanh/.test(t);
  const titulo = (t2.replace(vm[0], " ").replace(/\b(vou|vai|tenho que|preciso|pagar|pago|paguei|gastei|com|o|a|de|do|da|no|na|em|hoje|amanhã|reais|todo mês|receber|recebo|recebi|vence|vencimento|programar|registrar|lançar|pelo|pela|para)\b/gi, " ").replace(/\s+/g," ").trim()) || (entrada ? "Entrada" : "Gasto");
  const nome = titulo.charAt(0).toUpperCase() + titulo.slice(1);
  const categoria = /aluguel|condom|energia|luz|[aá]gua/.test(t) && !entrada ? L("Moradia", "Aluguel e estrutura") : /\bdas\b|simples|inss|fgts|imposto/.test(t) && state.tipo === "pj" ? "Impostos e taxas" : guessCat(titulo, entrada ? "entrada" : "saida");
  return { resposta: futuro ? L("Anotei na agenda.", "Registrado em contas a pagar e receber.") : L("Registrei o lançamento.", "Movimentação registrada."), acoes: [ futuro ? { tipo:"programar", titulo:nome, valor, data, categoria, entrada, mensal: /todo m[eê]s|mensal/.test(t) } : { tipo:"lancar", descricao:nome, valor, data, categoria, entrada } ] };
}

async function runAction(a){
  const okDate = d => /^\d{4}-\d{2}-\d{2}$/.test(String(d||"")) ? d : todayStr();
  const entrada = !!a.entrada, type = entrada ? "entrada" : "saida";
  const valid = entrada ? VALID_IN : VALID_OUT;
  if (a.tipo === "programar" || a.tipo === "lancar") {
    const valor = Math.round(Math.abs(+a.valor || parseMoney(a.valor)) * 100) / 100;
    if (!valor) return { kind:"erro", label:"Faltou o valor", detail:"Diga quanto é, por exemplo 100 reais." };
    const nome = String(a.titulo || a.descricao || (entrada ? "Entrada" : "Gasto")).slice(0, 80), date = okDate(a.data);
    const cat = valid.includes(a.categoria) ? a.categoria : guessCat(nome, type);
    if (a.tipo === "programar") {
      const doc = { id:"a-"+rid(), type, amount:valor, cat, date, title:nome, rec: a.mensal ? "mensal" : "unica", ate:"", pulados:{}, createdAt:Date.now() };
      await store.put("ag", doc);
      return { entrada, label:`${L("Programado", entrada ? "Conta a receber" : "Conta a pagar")}: ${nome}`, detail:`${entrada?"+":"−"} ${money(valor)} · ${fmtD(date)}${a.mensal?" · todo mês":""} · ${cat}`, ids:[["ag", doc.id]] };
    }

  }

    const ag = state.ag.find(x => x.id === a.programacao_id); if (!ag) return { kind:"erro", label:"Não achei essa programação" };
    const ym = /^\d{4}-\d{2}$/.test(a.mes||"") ? a.mes : ymOf(todayStr()), occ = occurrences(ym).find(o => o.ag.id === ag.id);

    await store.put("tx", { id, type:ag.type||"saida", amount:ag.amount, cat:ag.cat, desc:ag.title, date: occ ? occ.date : todayStr(), src:"agenda", createdAt:Date.now() });

  }

  }
  return { kind:"erro", label:"Não entendi essa ação" };
}

  // ---- DRE fácil ----

const FORMAS = ["Pix", "Boleto", "Transferência", "Cartão de crédito", "Cartão de débito", "Dinheiro"];
const partyOf = a => a.forn ? (state.forn.find(f => f.id === a.forn) || { nome: "Fornecedor removido" }) : a.cli ? (state.cli.find(c => c.id === a.cli) || { nome: "Cliente removido" }) : null;
const daysTo = d => Math.round((new Date(d + "T12:00") - new Date(todayStr() + "T12:00")) / 864e5);
function contasOcc(kind){
  const want = kind === "receber", out = [];
  for (let i = -6; i <= 3; i++) out.push(...occurrences(addMonths(state.ym, i)));
  return out.filter(o => (o.ag.type === "entrada") === want);
}
function situacao(o, kind){
  if (o.paid) return { t: kind === "receber" ? "Recebido" : "Pago", c: "ok" };
  const d = daysTo(o.date);
  if (d < 0) return { t: kind === "receber" ? `Em atraso há ${-d} dia${d < -1 ? "s" : ""}` : `Vencida há ${-d} dia${d < -1 ? "s" : ""}`, c: "late" };
  if (d === 0) return { t: "Vence hoje", c: "soon" };
  if (d <= 7) return { t: `Vence em ${d} dia${d > 1 ? "s" : ""}`, c: "soon" };
  return { t: "Em aberto", c: "" };
}
function renderContas(){

  clearTimeout(animT); animT = setTimeout(() => view.classList.remove("anim"), 1400);
  // números que contam até o valor
  const parse = t => { const m = t.match(/^(−|-)?\s*R\$\s*([\d.]+,\d{2})$/); if (!m) return null; return (m[1] ? -1 : 1) * parseFloat(m[2].replace(/\./g, "").replace(",", ".")); };
  view.querySelectorAll(".summary .v, .pjK b, .pfCards b, .psBig, .isAmt, .wfVal, .agNums b, .capHead b").forEach(el => {
    if (el.children.length) return;
    const txt = el.textContent.trim().replace(/\u00a0/g, " "), target = parse(txt);
    if (target === null || !isFinite(target)) return;
    const t0 = performance.now(), dur = 750;
    const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = (txt.startsWith("−") ? "−" : "") + money(Math.abs(target) * e).replace("-", "");
      if (k < 1) requestAnimationFrame(step); else el.textContent = txt; };
    requestAnimationFrame(step);
  });
}

    : state.role === "empresa" ? `<div class="spaceBar"><span class="chip ap">NMS · Empresa</span></div>` : "";
  const corpBand = state.tipo === "pj" && state.tab !== "chat" && state.tab !== "master" ? `<div class="corpBand"><b>${state.space === "nms" ? "NMS" : "Empresa"}</b><span>Relatório gerencial</span><span>Período: ${monthName(state.ym)}</span><span>Emitido em ${new Date().toLocaleDateString("pt-BR")} às ${new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</span></div>` : "";
  const head = spaceBar + corpBand + (state.tab === "chat" ? `<div class="top"><span class="mLogo">${logoHTML(40)}</span><h1>${L("Chat do NMS","Assistente financeiro")}</h1><button class="btn small" data-act="chatClear">Limpar conversa</button></div>` : state.tab === "master" ? `<div class="top"><span class="mLogo">${logoHTML(40)}</span><h1>Painel Master</h1><span class="chip ex">acesso administrador</span></div>` : `<div class="top"><span class="mLogo">${logoHTML(40)}</span><h1>${(state.tipo === "pj" ? {painel:"Visão geral",dashboard:"DRE financeiro e indicadores",lancamentos:"Movimentações",calendario:"Calendário financeiro",agenda:"Contas a pagar e receber"} : {painel:"Painel do mês",dashboard:"Dashboard pessoal",lancamentos:"Lançamentos",calendario:"Calendário de capital",agenda:"Agenda do dinheiro"})[state.tab]}</h1>

}

function renderPainel(){
  const list = txOfMonth(state.ym), s = sums(list);
  const occ = occurrences(state.ym).filter(o => !o.paid);
  const pendOut = occ.filter(o => o.ag.type !== "entrada").reduce((a,o) => a + (+o.ag.amount||0), 0);
  const pendIn = occ.filter(o => o.ag.type === "entrada").reduce((a,o) => a + (+o.ag.amount||0), 0);
  const saldo = s.in - s.out, proj = saldo - pendOut + pendIn;

  const summary = `<div class="summary">
    <div class="k-in"><span class="label">${L("Entradas","Receitas")}</span><span class="v" style="color:var(--k-in)">${money(s.in)}</span><span class="hint">${list.filter(t=>t.type==="entrada").length} lançamentos</span></div>
    <div class="k-out"><span class="label">${L("Saídas","Despesas")}</span><span class="v" style="color:var(--k-out)">${money(s.out)}</span><span class="hint">${list.filter(t=>t.type!=="entrada").length} ${L("lançamentos","movimentações")}</span></div>
    <div class="k-bal"><span class="label">${L("Saldo do mês","Resultado do mês")}</span><span class="v ${saldo<0?"neg":""}">${money(saldo)}</span><span class="hint">entradas − saídas</span></div>
    <div class="k-proj"><span class="label">${L("Saldo projetado","Resultado projetado")}</span><span class="v ${proj<0?"neg":""}">${money(proj)}</span><span class="hint">com ${occ.length} itens da agenda</span></div>
  </div>`;

  // categorias
  const byCat = {}; list.filter(t => t.type !== "entrada").forEach(t => byCat[t.cat] = (byCat[t.cat]||0) + (+t.amount||0));
  const cats = Object.entries(byCat).sort((a,b) => b[1]-a[1]);
  const total = s.out || 1;
  const prevList = txOfMonth(addMonths(state.ym,-1)).filter(t => t.type !== "entrada");
  const prevBy = {}; prevList.forEach(t => prevBy[t.cat] = (prevBy[t.cat]||0) + (+t.amount||0));
  const cnt = {}; list.filter(t => t.type !== "entrada").forEach(t => cnt[t.cat] = (cnt[t.cat]||0) + 1);
  if (state.selCat && !byCat[state.selCat]) state.selCat = null;
  const PW = 600, PH = 340, PCX = PW/2, PCY = PH/2, PR = 112; let a0 = -Math.PI/2;
  const polar = (r, a, ox=0, oy=0) => [PCX + ox + r*Math.cos(a), PCY + oy + r*Math.sin(a)];
  const sl = cats.map(([k,v]) => {
    const frac = v/total, a1 = a0 + frac*2*Math.PI, mid = (a0+a1)/2, o = { k, v, frac, a0, a1, mid, pct: frac*100 }; a0 = a1; return o; });
  const fmtPct = p => p < 1 ? "<1%" : Math.round(p) + "%";
  const shapes = sl.map(x => {
    const sel = state.selCat === x.k, faded = state.selCat && !sel;
    const off = sel && x.frac < .9999 ? 12 : 0, ox = off*Math.cos(x.mid), oy = off*Math.sin(x.mid);
    const [x0,y0] = polar(PR, x.a0, ox, oy), [x1,y1] = polar(PR, x.a1, ox, oy);
    const d = x.frac >= .9999 ? "" : `M${(PCX+ox).toFixed(1)} ${(PCY+oy).toFixed(1)} L${x0.toFixed(1)} ${y0.toFixed(1)} A${PR} ${PR} 0 ${x.frac>.5?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z`;
    const inner = x.pct >= 6 ? (() => { const [lx,ly] = polar(x.frac >= .9999 ? 0 : PR*.62, x.mid, ox, oy); return `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" dy=".35em" text-anchor="middle" class="pieLbl">${fmtPct(x.pct)}</text>`; })() : "";
    return `<g class="slice" data-act="pie" data-cat="${esc(x.k)}" style="opacity:${faded?.35:1}" tabindex="0" role="button" aria-label="${esc(x.k)} ${fmtPct(x.pct)}, ${money(x.v)}">
      ${x.frac >= .9999 ? `<circle cx="${PCX}" cy="${PCY}" r="${PR}" fill="${catColor(x.k)}"/>` : `<path d="${d}" fill="${catColor(x.k)}" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round"/>`}${inner}
      <title>${esc(x.k)}: ${fmtPct(x.pct)} · ${money(x.v)}</title></g>`; }).join("");
  // rótulos externos com linha-guia, espaçados por lado
  const labs = sl.filter(x => x.pct >= 2).map(x => ({ ...x, right: Math.cos(x.mid) >= 0, y: PCY + (PR+22)*Math.sin(x.mid) }));
  for (const side of [true,false]) {
    const g = labs.filter(l => l.right === side).sort((a,b) => a.y - b.y), gap = 34;
    for (let i=1;i<g.length;i++) if (g[i].y - g[i-1].y < gap) g[i].y = g[i-1].y + gap;
    const over = g.length ? g[g.length-1].y - (PH - 24) : 0;
    if (over > 0) { g.forEach(l => l.y -= over); for (let i=g.length-2;i>=0;i--) if (g[i+1].y - g[i].y < gap) g[i].y = g[i+1].y - gap; }
    g.forEach(l => l.y = Math.max(18, l.y));
  }
  const leaders = labs.map(l => {
    const sel = state.selCat === l.k, off = sel ? 12 : 0;
    const [ax,ay] = polar(PR+2, l.mid, off*Math.cos(l.mid), off*Math.sin(l.mid)), [bx] = polar(PR+20, l.mid);
    const ex = l.right ? PCX + PR + 46 : PCX - PR - 46, tx = l.right ? ex + 6 : ex - 6, anchor = l.right ? "start" : "end";
    return `<g class="lead" data-act="pie" data-cat="${esc(l.k)}" style="opacity:${state.selCat && !sel ? .35 : 1}">
      <polyline points="${ax.toFixed(1)},${ay.toFixed(1)} ${bx.toFixed(1)},${l.y.toFixed(1)} ${ex.toFixed(1)},${l.y.toFixed(1)}" fill="none" stroke="${catColor(l.k)}" stroke-width="1.5"/>
      <circle cx="${ax.toFixed(1)}" cy="${ay.toFixed(1)}" r="2.5" fill="${catColor(l.k)}"/>
      <text x="${tx.toFixed(1)}" y="${(l.y-3).toFixed(1)}" text-anchor="${anchor}" class="leadName">${esc(l.k)}</text>
      <text x="${tx.toFixed(1)}" y="${(l.y+12).toFixed(1)}" text-anchor="${anchor}" class="leadVal"><tspan style="fill:${catColor(l.k)};font-weight:600">${fmtPct(l.pct)}</tspan> · ${money(l.v)}</text></g>`; }).join("");

  // painel lateral: destaques ou detalhe da categoria escolhida
  const outs = list.filter(t => t.type !== "entrada");
  const biggest = outs.slice().sort((a,b) => b.amount - a.amount)[0];
  const daysGone = state.ym === ymOf(todayStr()) ? +todayStr().slice(8) : dim(state.ym);
  const side = !cats.length ? "" : state.selCat ? (() => {
    const k = state.selCat, v = byCat[k], items = outs.filter(t => t.cat === k).sort((a,b) => b.amount - a.amount);
    const pv = prevBy[k] || 0, dv = pv ? (v - pv)/pv*100 : null;
    return `<div class="pieSide" style="--k:${catColor(k)}">
      <div class="label">Categoria selecionada</div>
      <div class="psHead"><span class="dot" style="background:${catColor(k)};width:14px;height:14px"></span><b>${esc(k)}</b></div>
      <div class="psBig num">${money(v)}</div>
      <div class="psStats">
        <div><span class="label">Do total</span><b class="num">${fmtPct(v/total*100)}</b></div>
        <div><span class="label">Lançamentos</span><b class="num">${items.length}</b></div>
        <div><span class="label">Média</span><b class="num">${money(v/items.length)}</b></div>
        <div><span class="label">vs ${monthShort(addMonths(state.ym,-1))}</span><b class="num" style="color:${dv===null?"var(--muted)":dv>0?"var(--k-out)":"var(--k-in)"}">${dv===null?"—":`${dv>0?"▲":"▼"} ${Math.abs(dv).toFixed(0)}%`}</b></div>
      </div>
      <div class="label" style="margin-top:6px">Maiores gastos</div>
      <div class="psList">${items.slice(0,5).map(t => `<button data-act="editTx" data-id="${esc(t.id)}"><span class="num">${t.date.slice(8)}/${t.date.slice(5,7)}</span><span>${esc(t.desc)}</span><b class="num">${money(t.amount)}</b></button>`).join("")}</div>
      <div class="tools"><button class="btn small" data-act="filterCat" data-cat="${esc(k)}">Ver todos os lançamentos</button><button class="btn small" data-act="pie" data-cat="${esc(k)}">Limpar seleção</button></div>
    </div>`; })() : `<div class="pieSide">
      <div class="label">Destaques do mês</div>
      <div class="psStats">
        <div><span class="label">Maior categoria</span><b>${esc(cats[0][0])}</b><small class="num">${fmtPct(cats[0][1]/total*100)} · ${money(cats[0][1])}</small></div>
        <div><span class="label">Maior gasto</span><b>${esc(biggest.desc)}</b><small class="num">${money(biggest.amount)} · ${biggest.date.slice(8)}/${biggest.date.slice(5,7)}</small></div>
        <div><span class="label">Média por dia</span><b class="num">${money(s.out/Math.max(1,daysGone))}</b><small>em ${daysGone} dias</small></div>
        <div><span class="label">Top 3 juntas</span><b class="num">${fmtPct(cats.slice(0,3).reduce((a,c)=>a+c[1],0)/total*100)}</b><small>dos gastos</small></div>
      </div>
      <p class="note">Toque em uma fatia ou linha da tabela para ver o detalhe da categoria.</p>
    </div>`;

  const table = `<div class="catTbl"><table><thead><tr><th>Categoria</th><th class="r">Valor</th><th class="r">%</th><th class="r hideS">Lanç.</th><th class="r hideS">Média</th><th class="r">vs ${monthShort(addMonths(state.ym,-1))}</th></tr></thead><tbody>
    ${cats.map(([k,v]) => { const pv = prevBy[k]||0, dv = pv ? (v-pv)/pv*100 : null, p = v/total*100;
      return `<tr class="${state.selCat===k?"sel":""}" data-act="pie" data-cat="${esc(k)}">
        <td><span class="tcat"><span class="dot" style="background:${catColor(k)}"></span>${esc(k)}</span><span class="tbar"><i style="width:${(v/cats[0][1]*100).toFixed(1)}%;background:${catColor(k)}"></i></span></td>
        <td class="r num">${money(v)}</td><td class="r num"><b>${fmtPct(p)}</b></td><td class="r num hideS">${cnt[k]}</td><td class="r num hideS">${money(v/cnt[k])}</td>
        <td class="r num" style="color:${dv===null?"var(--muted)":dv>0?"var(--k-out)":"var(--k-in)"}">${dv===null?"novo":`${dv>0?"▲":"▼"} ${Math.abs(dv).toFixed(0)}%`}</td></tr>`; }).join("")}
    <tr class="tot"><td>Total</td><td class="r num">${money(s.out)}</td><td class="r num">100%</td><td class="r num hideS">${outs.length}</td><td class="r num hideS">${money(s.out/Math.max(1,outs.length))}</td><td class="r num">${(() => { const pt0 = prevList.reduce((a,t)=>a+(+t.amount||0),0); if (!pt0) return "—"; const d = (s.out-pt0)/pt0*100; return `<span style="color:${d>0?"var(--k-out)":"var(--k-in)"}">${d>0?"▲":"▼"} ${Math.abs(d).toFixed(0)}%</span>`; })()}</td></tr>
  </tbody></table></div>`;

  const catPanel = `<section class="panel"><h2>${L("Gastos por categoria","Despesas por categoria")} <small>${money(s.out)} em ${cats.length} categorias</small></h2>${cats.length ? `
    <div class="pieWrap">
      <svg class="pie" viewBox="0 0 ${PW} ${PH}" role="img" aria-label="Gráfico de pizza dos gastos por categoria">${shapes}${leaders}</svg>
      ${side}
    </div>
    ${table}`
    : `<div class="empty">Nenhum gasto em ${monthName(state.ym)}. Adicione um lançamento ou importe o extrato do banco.</div>`}</section>`;

  // histórico 6 meses
  const months = [...Array(6)].map((_,i) => addMonths(state.ym, i-5));
  const data = months.map(m => sums(txOfMonth(m)));
  const max = Math.max(1, ...data.flatMap(d => [d.in,d.out]));
  const W=520,H=190,pl=8,pb=26,pt=22,bw=26, step=(W-pl*2)/6;
  const y = v => H-pb - v/max*(H-pb-pt);
  const histSvg = `<svg class="hist" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas dos últimos 6 meses">
    <line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>
    <text x="0" y="12">máx. ${money(max)}</text>
    ${data.map((d,i) => { const cx = pl + step*i + step/2; return `
      <rect x="${cx-bw-2}" y="${y(d.in)}" width="${bw}" height="${H-pb-y(d.in)}" rx="3" fill="var(--k-in)" opacity="${months[i]===state.ym?1:.55}"/>
      <rect x="${cx+2}" y="${y(d.out)}" width="${bw}" height="${H-pb-y(d.out)}" rx="3" fill="var(--k-out)" opacity="${months[i]===state.ym?1:.55}"/>
      <text x="${cx}" y="${H-8}" text-anchor="middle" style="${months[i]===state.ym?"fill:var(--fg);font-weight:600":""}">${monthShort(months[i])}</text>`; }).join("")}
  </svg>`;
  const histPanel = `<section class="panel"><h2>Últimos 6 meses <small><span style="color:var(--k-in)">■</span> entradas <span style="color:var(--k-out)">■</span> saídas</small></h2>${histSvg}</section>`;

  // agenda em destaque
  const all = occurrences(state.ym), t0 = todayStr();
  const progOut = all.filter(o => o.ag.type !== "entrada");
  const totProg = progOut.reduce((a,o) => a + (+o.ag.amount||0), 0);
  const paidProg = progOut.filter(o => o.paid).reduce((a,o) => a + (+o.ag.amount||0), 0);
  const late = occ.filter(o => o.date < t0).length;
  const cards = occ.slice(0,8).map(o => {
    const a = o.ag, isIn = a.type === "entrada";
    const k = o.date < t0 ? "var(--k-out)" : (new Date(o.date) - new Date(t0))/864e5 <= 3 ? "var(--warn)" : isIn ? "var(--k-in)" : "var(--k-bal)";
    const st = o.date < t0 ? `<span class="chip late">atrasado</span>` : (new Date(o.date) - new Date(t0))/864e5 <= 3 ? `<span class="chip soon">em breve</span>` : `<span class="chip">previsto</span>`;
    const [yy,mm,dd] = o.date.split("-").map(Number);
    return `<div class="agCard" style="--k:${k}">
      <div class="agDate"><b>${dd}</b><span>${new Date(yy,mm-1,dd).toLocaleDateString("pt-BR",{weekday:"short"}).replace(".","")}</span></div>
      <button class="agTitle" data-act="editAg" data-id="${esc(a.id)}" data-ym="${o.ym}">${esc(a.title)}</button>
      <div class="agMeta"><span class="dot" style="background:${catColor(a.cat)}"></span>${esc(a.cat)}</div>
      <div class="agFoot"><span class="amt" style="color:${isIn?"var(--k-in)":"var(--k-out)"}">${isIn?"+":"−"} ${money(a.amount)}</span>${st}</div>
      <button class="btn small" data-act="pay" data-id="${esc(a.id)}" data-ym="${o.ym}">${isIn?"Recebi":"Paguei"}</button>
    </div>`; }).join("");
  const pct = totProg ? paidProg/totProg*100 : 0;
  const agPanel = `<section class="panel agHero"><h2>${L("Agenda do mês","Contas a pagar e receber")} <small><button class="btn small" data-act="tab" data-tab="calendario">Calendário</button> <button class="btn small primary" data-act="newAg">+ Programar</button></small></h2>
    <div class="agProg"><div class="agBar"><i style="width:${pct.toFixed(1)}%"></i></div>

function renderCal(){
  const ym = state.ym, t = todayStr(), occ = occurrences(ym), txs = txOfMonth(ym);
  const days = dim(ym), [y,m] = ym.split("-").map(Number), first = (new Date(y,m-1,1).getDay()+6)%7;
  const info = {};
  for (let d=1; d<=days; d++) info[`${ym}-${pad(d)}`] = {occ:[], tx:[], pin:0, pout:0, rin:0, rout:0};
  occ.forEach(o => { const c = info[o.date]; if (!c) return; c.occ.push(o); if (!o.paid) { if (o.ag.type==="entrada") c.pin += +o.ag.amount||0; else c.pout += +o.ag.amount||0; } });
  const linked = new Set(occ.map(o => linkId(o.ag.id, o.ym)));
  txs.forEach(x => { const c = info[x.date]; if (!c) return; if (!linked.has(x.id)) c.tx.push(x); if (x.type==="entrada") c.rin += +x.amount||0; else c.rout += +x.amount||0; });
  const maxOut = Math.max(1, ...Object.values(info).map(c => c.pout + c.rout));
  let bal = 0, minBal = Infinity, minDay = null, peakDay = null, peak = 0;
  const totPin = occ.filter(o=>!o.paid&&o.ag.type==="entrada").reduce((a,o)=>a+(+o.ag.amount||0),0);
  const totPout = occ.filter(o=>!o.paid&&o.ag.type!=="entrada").reduce((a,o)=>a+(+o.ag.amount||0),0);
  const cells = Object.entries(info).map(([d,c], i) => {
    bal += c.rin - c.rout + c.pin - c.pout;
    if (bal < minBal) { minBal = bal; minDay = d; }
    const out = c.pout + c.rout; if (out > peak) { peak = out; peakDay = d; }
    const heat = out ? `--heat:color-mix(in srgb, var(--k-out) ${Math.round(6 + out/maxOut*20)}%, var(--surface))` : (c.pin||c.rin) ? `--heat:color-mix(in srgb, var(--k-in) 9%, var(--surface))` : "";

                   ...c.tx.map(x => ({kind:"tx", id:x.id, cat:x.cat, title:x.desc, amt:x.amount, inn:x.type==="entrada", paid:true, real:true}))];
    const net = (c.pin + c.rin) - (c.pout + c.rout);
    return `<div role="button" tabindex="0" class="cell ${d===t?"today":""} ${d===state.selDay?"sel":""}" style="${heat}" data-act="cday" data-day="${d}" aria-label="${dayLabel(d)}: ${items.length} itens">
      <span class="dn">${i+1}</span>
      ${items.slice(0,3).map(x => `<button class="it ${x.paid&&!x.real?"paid":""} ${x.late?"late":""}" data-act="calItem" data-kind="${x.kind}" data-id="${esc(x.id)}" data-ym="${ym}" title="${esc(x.title)} · ${esc(x.cat)} · ${money(x.amt)}${x.real ? "" : x.paid ? " · pago" : x.late ? " · atrasado" : " · previsto"}"><span class="itIco" style="color:${catColor(x.cat)}">${catIcon(x.cat, 12)}</span><span class="itT">${esc(x.title)}</span><span class="a" style="color:${x.inn?"var(--k-in)":"var(--k-out)"}">${x.inn?"+":"−"}${Math.round(x.amt).toLocaleString("pt-BR")}</span></button>`).join("")}
      ${items.length ? `<span class="mobIcons">${items.slice(0,3).map(x => `<span style="background:${catColor(x.cat)}">${catIcon(x.cat, 10)}</span>`).join("")}</span>` : ""}
      ${items.length > 3 ? `<span class="more">+${items.length-3} itens</span>` : ""}
      ${items.length ? `<span class="mob" style="color:${net>=0?"var(--k-in)":"var(--k-out)"}">${net>=0?"+":"−"}${Math.abs(net)>=1000?(Math.abs(net)/1000).toFixed(1).replace(".",",")+"k":Math.round(Math.abs(net))}</span>` : ""}
      ${items.length || d===t ? `<span class="bal"><span>saldo</span><span style="color:${bal<0?"var(--k-out)":"var(--k-bal)"}">${money(bal).replace(/,\d\d$/,"")}</span></span>` : ""}
    </div>`;
  });
  const grid = [..."SEG TER QUA QUI SEX SÁB DOM".split(" ")].map(w => `<div class="wd">${w}</div>`).join("")
    + Array(first).fill('<div class="cell blank"></div>').join("") + cells.join("")
    + Array((7 - (first + days) % 7) % 7).fill('<div class="cell blank"></div>').join("");

  const sel = state.selDay && info[state.selDay];
  const detail = sel ? `<section class="panel"><h2>${dayLabel(state.selDay)} <small><button class="btn small primary" data-act="newAg" data-day="${state.selDay}">+ Programar neste dia</button></small></h2>
      ${sel.occ.length ? `<div class="label" style="margin:4px 0">Programado</div><div class="list">${sel.occ.map(occRow).join("")}</div>` : ""}
      ${sel.tx.length ? `<div class="label" style="margin:14px 0 4px">Realizado</div><div class="list">${sel.tx.map(txRow).join("")}</div>` : ""}
      ${!sel.occ.length && !sel.tx.length ? `<div class="empty">Nenhum movimento neste dia. Use + Programar para reservar capital aqui.</div>` : ""}
    </section>` : `<p class="note">Toque em um dia para ver os detalhes ou programar capital nele.</p>`;

  return `<div class="capHead">
      <div style="--k:var(--k-out)"><span class="label">A pagar no mês</span><b>${money(totPout)}</b></div>
      <div style="--k:var(--k-in)"><span class="label">A receber no mês</span><b>${money(totPin)}</b></div>
      <div style="--k:var(--k-proj)"><span class="label">Dia mais pesado</span><b>${peakDay ? `${peakDay.slice(8)}/${peakDay.slice(5,7)} · ${money(peak)}` : "—"}</b></div>
      <div style="--k:${minBal<0?"var(--k-out)":"var(--k-bal)"}"><span class="label">Menor saldo previsto</span><b>${minDay ? `${money(minBal)}` : "—"}</b></div>
    </div>

    <div class="mcalBox"><div class="mcal">${grid}</div></div>
    ${detail}`;
}

    };
    modal.querySelector("#f-amt").focus();
  };

/* ---------- importação de extrato (OFX / CSV) ---------- */
function parseOFX(text){
  const out = [];
  for (const blk of text.split(/<STMTTRN>/i).slice(1)) {
    const g = tag => { const m = blk.match(new RegExp(`<${tag}>([^<\\r\\n]*)`, "i")); return m ? m[1].trim() : ""; };
    const v = parseMoney(g("TRNAMT")), d = g("DTPOSTED");
    if (isNaN(v) || d.length < 8) continue;
    out.push({ date:`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`, value:v, desc: g("MEMO") || g("NAME") || "Lançamento", fid: g("FITID") });
  }
  return out;
}
function splitCSV(line, sep){
  const r = []; let cur = "", q = false;
  for (const ch of line) { if (ch === '"') q = !q; else if (ch === sep && !q) { r.push(cur); cur = ""; } else cur += ch; }
  r.push(cur); return r.map(s => s.trim());
}
function parseCSV(text){
  const lines = text.replace(/^﻿/, "").split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];
  const norm = x => String(x || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  // acha a linha de cabeçalho (bancos costumam colocar dados da conta antes da tabela)
  const hi = lines.findIndex(l => { const n = norm(l); return /\bdata\b|date|\bdt\b/.test(n) && /valor|amount|value|quantia|montante|credito|debito|entrada|saida/.test(n); });
  if (hi < 0) return [];
  const count = (l, c) => l.split(c).length - 1;
  const sep = [";", "\t", ",", "|"].sort((a, b) => count(lines[hi], b) - count(lines[hi], a))[0];
  const head = splitCSV(lines[hi], sep).map(norm);
  const find = re => head.findIndex(h => re.test(h));
  const iD = find(/^data|date|^dt\b|data (do )?lanc|data mov/), iV = find(/^valor|valor \(r\$\)|amount|quantia|value|montante|^vlr/);
  const iC = find(/credito|entrada|^cr$/), iDb = find(/debito|saida|^db$/);
  const iT = find(/descri|hist|title|estabelec|lancamento|memo|detalhe|favorecido|beneficiario|nome/), iId = find(/identificador|^id$|n.? ?doc|documento/);

/* extrato em texto (copiado ou lido do PDF), no formato do Banco do Brasil e parecidos:
   "01/10/2026 13105 100101 Pix - Enviado / 01/10 07:27 99 TECNOLOGIA LTDA / 11,30 (-)" */
function parseBankText(text){
  let t = String(text || "").replace(/\r/g, "");
  const cut = t.search(/Lan[cç]amentos Futuros/i); if (cut > 0) t = t.slice(0, cut);
  const re = /(\d{2}\/\d{2}\/\d{4})[ \t]+(\d{1,6})[ \t]+(?:(\d{3,20})[ \t]+)?([\s\S]*?)[ \t]*(-?[\d.]*\d,\d{2})[ \t]*\(\s*([+-])\s*\)/g;
  const out = []; let m;
  while ((m = re.exec(t))) {
    const [, d, lote, doc, body, val, sg] = m;
    const lines = body.split("\n").map(x => x.replace(/Extrato de Conta Corrente[\s\S]*$/i, "").trim()).filter(Boolean);
    const flat = lines.join(" ");
    if (!flat || /^saldo\b|^s a l d o|saldo do dia|saldo anterior/i.test(flat)) continue;
    const tipo = lines[0];
    const party = lines.slice(1).join(" ").replace(/\b\d{2}\/\d{2}\s+\d{2}:\d{2}\b/g, "").replace(/\b\d{8,}\b/g, "").replace(/\s+/g, " ").trim();
    const [dd, mm, yy] = d.split("/");
    const v = Math.abs(parseMoney(val));
    if (!isFinite(v) || !v) continue;
    out.push({ date: `${yy}-${mm}-${dd}`, value: sg === "-" ? -v : v, desc: (party && party.toLowerCase() !== tipo.toLowerCase() ? `${party} · ${tipo}` : tipo).slice(0, 140), fid: doc ? `bb-${d}-${lote}-${doc}` : "" });
  }
  return out;
}
const looksBankText = t => /\(\s*[+-]\s*\)/.test(t) && /\d{2}\/\d{2}\/\d{4}[ \t]+\d{1,6}[ \t]+/.test(t);
let xlsxReady = null;
function loadXLSX(){
  if (xlsxReady) return xlsxReady;
  xlsxReady = new Promise((ok, no) => { const el = document.createElement("script"); el.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; el.onload = () => ok(window.XLSX); el.onerror = () => { xlsxReady = null; no(new Error("load")); }; document.head.appendChild(el); });
  return xlsxReady;
}

let pdfReady = null;
function loadPdfJs(){
  if (pdfReady) return pdfReady;
  const add = src => new Promise((ok, no) => { const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = () => no(new Error("load")); document.head.appendChild(el); });
  const v = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  pdfReady = add(v + "pdf.min.js").then(() => add(v + "pdf.worker.min.js")).then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = v + "pdf.worker.min.js"; return window.pdfjsLib; });
  pdfReady.catch(() => { pdfReady = null; });
  return pdfReady;
}
async function pdfText(buf){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
  let out = "";
  for (let p = 1; p <= Math.min(doc.numPages, 30); p++) {
    const page = await doc.getPage(p), tc = await page.getTextContent(), lines = new Map();
    for (const it of tc.items) { if (!it.str || !it.str.trim()) continue; const y = Math.round(it.transform[5] / 3); (lines.get(y) || lines.set(y, []).get(y)).push(it); }
    [...lines.keys()].sort((a,b) => b-a).forEach(y => { out += lines.get(y).sort((a,b) => a.transform[4]-b.transform[4]).map(i => i.str.trim()).join("  ") + "\n"; });
    out += "\n";
  }
  return out;
}
const VALID_OUT = CATS.saida.map(c => c.k), VALID_IN = CATS.entrada.map(c => c.k);

function matchAgenda(rows){
  const used = new Set(state.tx.map(t => t.id)), months = [...new Set(rows.map(r => ymOf(r.date)))];
  const pend = months.flatMap(m => occurrences(m)).filter(o => !o.paid);
  for (const r of rows) {
    let best = null, bestScore = -1;
    for (const o of pend) {
      const id = linkId(o.ag.id, o.ym); if (used.has(id)) continue;
      if ((o.ag.type === "entrada") !== (r.type === "entrada")) continue;
      const amt = +o.ag.amount || 0; if (Math.abs(amt - r.amount) > Math.max(1, amt * 0.02)) continue;
      const days = Math.abs((new Date(r.date) - new Date(o.date)) / 864e5); if (days > 7) continue;
      const words = normKey(o.ag.title).split(" ").filter(w => w.length > 3);
      const score = (7 - days) + (words.some(w => normKey(r.desc).includes(w)) ? 10 : 0) + (Math.abs(amt - r.amount) < .01 ? 3 : 0);
      if (score > bestScore) { bestScore = score; best = o; }
    }
    if (best) { r.match = best; r.id = linkId(best.ag.id, best.ym); r.cat = best.ag.cat; r.how = "agenda"; used.add(r.id); }
  }
}

  else if (act === "cpTab") { state.cpTab = el.dataset.v; render(); }
  else if (act === "cpFiltro") { state.cpFiltro = el.dataset.v; render(); }
  else if (act === "contaNew") openConta(el.dataset.v, null, el.dataset.p ? { [el.dataset.v === "receber" ? "cli" : "forn"]: el.dataset.p, cat: ((el.dataset.v === "receber" ? state.cli : state.forn).find(p => p.id === el.dataset.p) || {}).categoria } : null);
  else if (act === "contaEdit") { const a = state.ag.find(x => x.id === el.dataset.id); if (a) openConta(a.type === "entrada" ? "receber" : "pagar", a); }
  else if (act === "partyNew") { state.cpTab = el.dataset.k === "forn" ? "fornecedores" : "clientes"; openParty(el.dataset.k); }
  else if (act === "partyEdit") openParty(el.dataset.k, (el.dataset.k === "forn" ? state.forn : state.cli).find(p => p.id === el.dataset.id));
  else if (act === "calItem") openCalItem(el.dataset.kind, el.dataset.id, el.dataset.ym);
  else if (act === "dreMode") { state.dreFull = el.dataset.v === "completo"; render(); }
  else if (act === "space") switchSpace(el.dataset.v);
  else if (act === "tipo") { if (state.tipo !== el.dataset.v) { state.tipo = el.dataset.v; applyTipo(state.tipo); render(); saveBase().catch(() => toast("Não foi possível salvar o tipo de conta.")); queueMember(); toast(state.tipo === "pj" ? "Conta PJ: categorias empresariais e indicadores financeiros" : "Conta PF: categorias pessoais e indicadores simples"); } }
  else if (act === "mCat") { state.mCat = el.dataset.cat; render(); }
  else if (act === "mUser") { state.mUser = el.dataset.id && el.dataset.id !== state.mUser ? el.dataset.id : null; if (state.mUser) loadUser(state.mUser); render(); if (state.mUser) window.scrollTo({ top: 0, behavior: "smooth" }); }
  else if (act === "mReload") { if (state.mUser) loadUser(state.mUser, true); }
  else if (act === "limits") openLimits();
  else if (act === "chatSug") sendChat(el.dataset.t);
  else if (act === "chatUndo") chatUndo(+el.dataset.i, +el.dataset.j);
  else if (act === "chatConfirm" || act === "chatCancel") chatConfirm(+el.dataset.i, +el.dataset.j, act === "chatConfirm");
  else if (act === "chatClear") { if (!el.dataset.sure) { el.dataset.sure = 1; el.textContent = "Toque de novo para limpar"; return; } state.chat = []; saveChat(); render(); }
  else if (act === "tom") { if (state.tom !== el.dataset.v) { state.tom = el.dataset.v; render(); saveBase().catch(() => toast("Não foi possível salvar o tom agora.")); toast(state.tom === "bravo" ? "Modo bravo ligado. Prepare-se." : "Avisos no tom normal"); } }
  else if (act === "alertOk") { dismiss(el.dataset.k); render(); }
  else if (act === "alertSee") { const f = el.dataset.f; if (CATS.saida.some(c => c.k === f)) { state.fcat = f; state.q = ""; } else { state.fcat = ""; state.q = /^ifood$/i.test(f) ? "" : f; if (/^ifood$/i.test(f)) state.fcat = "Delivery"; } state.tab = "lancamentos"; render(); window.scrollTo(0,0); }
  else if (act === "pie") { state.selCat = state.selCat === el.dataset.cat ? null : el.dataset.cat; render(); }
  else if (act === "filterCat") { state.fcat = el.dataset.cat; state.tab = "lancamentos"; render(); }
  else if (act === "pay" || act === "unpay") {
    const a = state.ag.find(x => x.id === el.dataset.id), ym = el.dataset.ym; if (!a) return;
    const occ = occurrences(ym).find(o => o.ag.id === a.id);
    const txId = linkId(a.id, ym); el.disabled = true;
    try {
      if (act === "pay") {
        const pn = a.forn ? state.forn.find(f => f.id === a.forn)?.nome : a.cli ? state.cli.find(c => c.id === a.cli)?.nome : "";
        await store.put("tx", { id:txId, type:a.type||"saida", amount:a.amount, cat:a.cat, desc: pn ? `${a.title} · ${pn}` : a.title, date: occ ? occ.date : `${ym}-01`, src:"agenda", createdAt:Date.now(), ...(a.forn?{forn:a.forn}:{}), ...(a.cli?{cli:a.cli}:{}), ...(a.exemplo?{exemplo:true}:{}) });
        toast(a.type==="entrada" ? "Marcado como recebido" : "Marcado como pago");
      } else {
        await store.remove("tx", txId);
        toast("Pagamento desfeito");
      }
    } catch { el.disabled = false; toast("Não foi possível atualizar. Tente de novo."); }
  }
  else if (act === "clearEx") {
    if (!el.dataset.sure) { el.dataset.sure = 1; el.textContent = "Confirmar: apagar exemplos"; return; }
    el.disabled = true;
    const tx = state.tx.filter(t => t.exemplo).map(t => t.id), ag = state.ag.filter(a => a.exemplo).map(a => a.id);
    for (const id of tx) await store.remove("tx", id).catch(()=>{});
    for (const id of ag) await store.remove("ag", id).catch(()=>{});
    for (const f of state.forn.filter(x => x.exemplo)) await store.remove("forn", f.id).catch(()=>{});
    for (const c of state.cli.filter(x => x.exemplo)) await store.remove("cli", c.id).catch(()=>{});
    toast("Exemplos apagados");
  }
});
document.getElementById("fab").onclick = () => (state.tipo === "pj" && state.tab === "agenda") ? (state.cpTab === "fornecedores" ? openParty("forn") : state.cpTab === "clientes" ? openParty("cli") : openConta(state.cpTab === "receber" ? "receber" : "pagar")) : openForm((state.tab === "agenda" || state.tab === "calendario") ? "ag" : "tx", null, state.tab === "calendario" && state.selDay ? {date: state.selDay} : null);
let qT;
document.addEventListener("input", e => {
  if (e.target.id === "mQ") { clearTimeout(qT); qT = setTimeout(() => { state.mQ = e.target.value; render(); const q = document.getElementById("mQ"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 250); }
  if (e.target.id === "q") { clearTimeout(qT); qT = setTimeout(() => { state.q = e.target.value; render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 250); }
});
document.addEventListener("change", e => { if (e.target.id === "fcat") { state.fcat = e.target.value; render(); } if (e.target.id === "mCat") { state.mCat = e.target.value; render(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); if ((e.key === "Enter" || e.key === " ") && e.target.matches?.("[role=button][data-act]")) { e.preventDefault(); e.target.click(); } });
document.addEventListener("submit", e => { if (e.target.id === "chatForm") { e.preventDefault(); const i = document.getElementById("chatIn"); const v = i.value; i.value = ""; sendChat(v); } });

const h = (location.hash || "").slice(1);
if (["painel","dashboard","lancamentos","calendario","agenda","master"].includes(h)) state.tab = h;

/* ---------- app instalável: atualização, instalação e atalhos ---------- */
const VERSAO = (window.NMS_CONFIG && window.NMS_CONFIG.versao) || "1.0.0";
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("./sw.js").then(reg => {
    const bar = document.getElementById("updBar");
    const show = w => { bar.hidden = false; document.getElementById("updBtn").onclick = () => { bar.querySelector("button").disabled = true; w.postMessage("atualizar"); }; };
    if (reg.waiting && navigator.serviceWorker.controller) show(reg.waiting);
    reg.addEventListener("updatefound", () => { const w = reg.installing; w && w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) show(w); }); });
    setInterval(() => reg.update().catch(() => {}), 30 * 60000);
    window.addEventListener("focus", () => reg.update().catch(() => {}));
  }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloading) { reloading = true; location.reload(); } });
}
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; document.querySelectorAll(".instBtn").forEach(b => b.hidden = false); });
window.addEventListener("appinstalled", () => { installEvt = null; document.querySelectorAll(".instBtn").forEach(b => b.hidden = true); toast("NMS instalado no seu computador"); });
document.addEventListener("click", async e => { const b = e.target.closest(".instBtn"); if (!b || !installEvt) return; installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; document.querySelectorAll(".instBtn").forEach(x => x.hidden = true); });
// atalhos de teclado (computador): Alt+1…6 trocam de aba, N cria um novo item, Esc fecha janelas
document.addEventListener("keydown", e => {
  if (!unlocked) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "") || document.activeElement?.isContentEditable;
  const tabs = ["painel","dashboard","lancamentos","calendario","agenda","master"];
  if (e.altKey && /^[1-6]$/.test(e.key)) { const t = tabs[+e.key - 1]; if (t === "master" && state.role !== "master") return; e.preventDefault(); state.tab = t; state.selDay = null; render(); window.scrollTo(0,0); return; }
  if (!typing && !e.ctrlKey && !e.metaKey && !e.altKey && (e.key === "n" || e.key === "N") && !document.querySelector(".scrim")) { e.preventDefault(); document.getElementById("fab").click(); }
});
document.getElementById("verTag").textContent = "Versão " + VERSAO;
pwaStart();
})();
</script>
